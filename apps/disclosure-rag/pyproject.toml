[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-rag"
version = "0.1.0"
description = "Disclosure RAG (Retrieval-Augmented Generation) system for UFO/UAP research and analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Liam Ellis", email = "liam@example.com"},
]
keywords = ["rag", "ufo", "uap", "disclosure", "research", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core dependencies
    "python-dotenv",
    "openai",
    "anthropic",
    "phidata",
    "streamlit",
    "pandas",
    "numpy",
    "tenacity",
    "agno",
    
    # Web processing
    "requests",
    "beautifulsoup4",
    "html2text",
    "markdownify",
    
    # Data processing
    "PyPDF2",
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-groq",
    "langchain-ollama",
    "faiss-cpu",
    "tiktoken",
    
    # Database
    "upstash-redis",
    "upstash-vector",
    "qstash",
    "xata",
    
    # YouTube processing
    "pytube",
    "youtube-transcript-api",
    "yt-dlp",
    
    # CLI and utilities
    "rich",
    "prompt-toolkit",
    "composio-langchain",
    "groq",
    
    # Note: Charm CLI tools (gum, huh, glow, glamour, bubbletea, lipgloss) 
    # are Go binaries and should be installed separately via:
    # - brew install gum huh glow glamour (on macOS)
    # - go install github.com/charmbracelet/gum@latest (etc.)
    
    # Optional dependencies
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "black",
    "isort",
    "flake8",
    "mypy",
    "pre-commit",
]

[project.scripts]
disclosure-rag = "main:main"
disclosure-chat = "disclosure_chat:main"
agno-chat = "agno_disclosure_chat:main"
agno-chat-files = "agno_disclosure_chat_with_files:main"
disclosure-cli = "cli:main"

[project.urls]
Homepage = "https://github.com/liamellis/ultraterrestrial-resurrection"
Repository = "https://github.com/liamellis/ultraterrestrial-resurrection"
Issues = "https://github.com/liamellis/ultraterrestrial-resurrection/issues"

[tool.setuptools]
packages = ["agents", "docs", "lib", "processing", "research", "utils"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"