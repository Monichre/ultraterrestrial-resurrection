# ═══════════════════════════════════════════════════════════════════════
# Enterprise LLM Routing Config — disclosure-rag
# ═══════════════════════════════════════════════════════════════════════
#
# Single source of truth for:
#   1. Tier declarations — which models are available and what they can do
#   2. Task declarations — what each pipeline stage needs
#   3. Routing rules — which tiers serve which tasks, in what order
#
# This file drives lib/llm_router.py and lib/llm_fallback.py.
# Code reads this config; it does not hardcode tier lists or task params.
#
# Model rankings reference (2026-08-15):
#   GPT-5.5 6.7% · GPT-5.6 Sol 6.2% · Claude Sonnet 4.6 5.1%
#   Gemini 3.1 Pro 5.0% · Claude Opus 4.8 4.6% · Claude Opus 4.7 4.4%
#   Claude Opus 5 3.9% · Claude Sonnet 5 3.7% · Gemini 3 Flash 3.0%
# ═══════════════════════════════════════════════════════════════════════

# ── Tier Declarations ─────────────────────────────────────────────────
#
# `kind` selects the wire protocol:
#   openai_compat       — OpenAI chat/completions shape (OpenAI, DeepSeek, Together, Groq, xAI, etc.)
#   anthropic           — Anthropic Messages API (forced tool calls for structured output)
#   google              — Google Generative AI API (native structured output)
#   openrouter_auto     — OpenRouter Auto Router (market-based model selection)
#   openrouter_preset   — OpenRouter Preset (server-side config referenced by @preset/slug)
#
# `capabilities`:
#   structured_output — can enforce JSON schema via response_format or equivalent
#   reasoning         — model emits chain-of-thought (needs token headroom)
#   streaming         — supports streaming responses
#   vision            — can process image inputs
#   pdf_input         — can accept PDF files directly (native or via OpenRouter plugin)
#
# `cost_tier`: 1 = cheapest, 5 = most expensive (relative, not absolute)
# `latency_tier`: 1 = fastest, 5 = slowest (relative)

tiers:
  # ── Tier 1: Google Gemini 3 Flash (fast classification, confirmed working) ──
  - id: google/gemini-3-flash
    provider: Google
    kind: google
    model: gemini-3-flash-preview
    env_keys: [GEMINI_API_KEY, GOOGLE_API_KEY]
    base_url: null
    capabilities:
      structured_output: true
      reasoning: false
      streaming: true
      vision: true
      pdf_input: true
    cost_tier: 1
    latency_tier: 1
    max_retries: 1
    notes: "Confirmed working 2026-08-15. Fastest + cheapest. Ideal for classification, validation, coherence review. Native PDF support."

  # ── Tier 2: Google Gemini 3.1 Pro (structured extraction, confirmed working) ──
