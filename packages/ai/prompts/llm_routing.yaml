  # ═══════════════════════════════════════════════════════════════════
  # OpenRouter Presets (server-side LLM configurations)
  # https://openrouter.ai/docs/guides/features/presets
  #
  # Presets encapsulate model + system prompt + params + provider routing
  # into a named slug (@preset/slug). They can be updated server-side
  # without code changes, keep version history, and can bundle server
  # tools (web_search, advisor, subagent).
  #
  # Create from any request body:
  #   POST /api/v1/presets/{slug}/chat/completions
  #
  # Reference in requests:
  #   model: "@preset/disclosure-classification"
  #
  # Request fields override preset fields (shallow merge).
  #
  # These tiers are placeholders — create the presets on OpenRouter and
  # they activate automatically. See scripts/sync_presets.py for a helper.
  # ═══════════════════════════════════════════════════════════════════

  # ── Tier 28: Preset — disclosure-classification ──
  - id: openrouter/preset-classification
    provider: OpenRouter
    kind: openrouter_preset
    model: "@preset/disclosure-classification"
