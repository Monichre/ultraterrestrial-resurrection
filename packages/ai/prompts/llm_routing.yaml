    base_url: https://openrouter.ai/api/v1
    preset_slug: disclosure-classification
    capabilities:
      structured_output: true
      reasoning: false
      streaming: true
      vision: false
      pdf_input: true
    cost_tier: 1
    latency_tier: 1
    max_retries: 1
    notes: "Preset for document_classification task. Create via scripts/sync_presets.py. Encapsulates model + system prompt + params server-side."

