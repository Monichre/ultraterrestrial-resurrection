  # ═══════════════════════════════════════════════════════════════════
  # OpenRouter Auto Router (market-based model selection)
  # https://openrouter.ai/docs/guides/routing/routers/auto-router
  #
  # Delegates model selection to OpenRouter's market intelligence:
  #   1. Classifies prompt into ~30 task types (code:debugging, agent:multi_step_planning, etc.)
  #   2. Ranks models by trailing 7-day community spend share for that task type
  #   3. Applies cost_tier band (low/medium/high/xhigh/max)
  #   4. Routes with built-in fallbacks
  #
  # No additional fee — you pay standard rate for whichever model is selected.
  # Response includes `model` field showing which model was actually used.
  # Use as a discovery tier: route through auto, log which model won, then
  # update explicit routing config with the winners.
  # ═══════════════════════════════════════════════════════════════════

  # ── Tier 23: OpenRouter Auto (market-based, low cost band) ──
  - id: openrouter/auto-low
    provider: OpenRouter
    kind: openrouter_auto
    model: openrouter/auto
    env_keys: [OPENROUTER_API_KEY]
    base_url: https://openrouter.ai/api/v1
    auto_router:
      plugin_id: auto-router
      cost_tier: low
    capabilities:
      structured_output: true
      reasoning: true
      streaming: true
      vision: true
      pdf_input: true
    cost_tier: 1
    latency_tier: 2
    max_retries: 1
    notes: "Market-based routing, low cost band. Favors cheapest capable models. Good for classification, validation, coherence_review."

