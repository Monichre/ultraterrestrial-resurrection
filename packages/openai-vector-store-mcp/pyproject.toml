[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-vector-store-mcp"
version = "0.1.0"
description = "MCP server exposing OpenAI Vector Store search + fetch tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0",
  "openai>=1.99",
  "pydantic>=2",
  "python-dotenv>=1.0",
]

[project.scripts]
openai-vector-store-mcp = "openai_vector_store_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_vector_store_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/openai_vector_store_mcp" = "openai_vector_store_mcp"

[tool.hatch.build.targets.sdist]
include = ["src/openai_vector_store_mcp", "README.md", "pyproject.toml"]