const el=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n};
const px=(gx,gy)=>(gx-gy)*26, py=(gx,gy,h)=>(gx+gy)*14.3-h*16;

function draw(){
  svg.textContent='';
  const defs=el('defs');
  const hp=el('pattern',{id:'hatch',width:6,height:6,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'});

  svg.appendChild(el('rect',{x:VIEW[0],y:VIEW[1],width:VIEW[2],height:VIEW[3],fill:'url(#hatch)',opacity:.5}));

  const gE=el('g'), gB=el('g'), gX=el('g');
  svg.appendChild(gE); svg.appendChild(gB); svg.appendChild(gX);

  const anchor=s=>({x:px(s.gx+W/2,s.gy+D/2), y:py(s.gx+W/2,s.gy+D/2,s.slab?0.35:s.h)+(s.slab?4:8)});
  const hot=new Set();
  if(lens==='seq'&&SEQ[step]) hot.add(SEQ[step][3]);

  const edges = (lens==='live'&&ORPHAN) ? E.concat([Object.assign({},ORPHAN,{orphan:1})]) : E;
  edges.forEach(e=>{
    const a=byId[e.f], b=byId[e.t]; if(!a||!b) return;
    const p=anchor(a), q=anchor(b);
    const mid=`${p.x},${q.y}`;
    const cls=['edge'];
    if(e.flow&&lens!=='live') cls.push('flow');
    if(e.dash||e.orphan) cls.push('dash');
    if(hot.has(e.f)&&hot.has(e.t)) cls.push('hot');
    const path=el('path',{d:`M${p.x},${p.y} L${mid} L${q.x},${q.y}`,class:cls.join(' ')});
    if(e.orphan){path.setAttribute('stroke','var(--warn)');path.setAttribute('opacity','.85')}
    if(!inLens(a)||!inLens(b)) path.classList.add('faded');
    gE.appendChild(path);
    if(e.flow&&lens==='flow'){
      const dot=el('circle',{r:1.5,class:'dot'});
      const an=el('animateMotion',{dur:'3s',repeatCount:'indefinite',path:`M${p.x},${p.y} L${mid} L${q.x},${q.y}`});
      dot.appendChild(an); gE.appendChild(dot);
    }
  });

  S.slice().sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy)).forEach(s=>{
    const h=s.slab?0.35:s.h, x=px(s.gx,s.gy), y=py(s.gx,s.gy,h);
    const g=el('g',{class:'blk'});
    if(!inLens(s)) g.classList.add('faded');
    const c=tone(s);
    // A status lens has to tint on its own — otherwise it looks identical
    // to every other view until you click something.
    const lit = hot.has(s.id) || flagged(s);
    const top=`${x},${y} ${x+W*26},${y+W*14.3} ${x+(W-D)*26},${y+(W+D)*14.3} ${x-D*26},${y+D*14.3}`;
    const lf=`${x-D*26},${y+D*14.3} ${x+(W-D)*26},${y+(W+D)*14.3} ${x+(W-D)*26},${y+(W+D)*14.3+h*16} ${x-D*26},${y+D*14.3+h*16}`;
    const rf=`${x+(W-D)*26},${y+(W+D)*14.3} ${x+W*26},${y+W*14.3} ${x+W*26},${y+W*14.3+h*16} ${x+(W-D)*26},${y+(W+D)*14.3+h*16}`;
    g.appendChild(el('polygon',{points:lf,class:'face',fill:lit?c:'var(--panel)','fill-opacity':lit?.55:.9}));
    g.appendChild(el('polygon',{points:rf,class:'face',fill:lit?c:'var(--hatch)','fill-opacity':lit?.4:.9}));
    g.appendChild(el('polygon',{points:top,class:'face',fill:lit?c:'var(--paper)','fill-opacity':lit?.75:.96}));
    const cx=x, cy=y+(W+D)/2*14.3-2;
    const t1=el('text',{x:cx,y:cy,class:'lbl'}); t1.textContent=s.name;
    if(lit) t1.setAttribute('font-weight','700');
    g.appendChild(t1);
    const t2=el('text',{x:cx,y:cy+5,class:'sub2'});
    t2.textContent=s.loc?`${s.code} · ${(s.loc/1000).toFixed(1)}k`:s.code;
    g.appendChild(t2);
    g.addEventListener('click',()=>{sel=s.id;render()});
    gB.appendChild(g);
  });

  if(lens!=='seq') EXT.forEach(x=>{
    const b=byId[x.t]; if(!b||!inLens(b)) return;
    const p=anchor(b), tx=p.x+x.ax[0], ty=p.y+x.ax[1];
    gX.appendChild(el('path',{d:`M${p.x},${p.y} L${tx},${ty}`,class:'extl'}));
    const t=el('text',{x:tx,y:ty-2,class:'ext','text-anchor':x.ax[0]<0?'end':'start'});
    t.textContent=x.n; gX.appendChild(t);
  });
}

function render(){
  document.getElementById('lenses').innerHTML=LENS.map(l=>
    `<button class="lens ${l.id===lens?'on':''}" data-l="${l.id}">${l.n}<small>${l.d}</small></button>`).join('');
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{
    lens=b.dataset.l; sel=null; location.hash=lens==='seq'?'#seq=1':'#lens='+lens; boot()});

  const groups={};
  S.filter(inLens).forEach(s=>{(groups[s.ws]=groups[s.ws]||[]).push(s)});
  document.getElementById('list').innerHTML=Object.entries(groups).map(([k,v])=>
    `<div class="grp">${WS[k]||k}</div>`+v.sort((a,b)=>b.loc-a.loc).map(s=>
      `<div class="item ${s.id===sel?'sel':''}" data-s="${s.id}"><b>${s.name}</b>${s.loc?`<span>${(s.loc/1000).toFixed(1)}k</span>`:''}</div>`).join('')).join('');
  document.querySelectorAll('[data-s]').forEach(d=>d.onclick=()=>{sel=d.dataset.s;render()});

  const p=document.getElementById('pbody'), t=document.getElementById('pt'), m=document.getElementById('pm');
  if(sel&&byId[sel]){
    const s=byId[sel];
    t.textContent=s.name; m.textContent=`${WS[s.ws]||s.ws} · ${s.loc?s.loc.toLocaleString()+' LOC':'measured elsewhere'}`;
    const ext=EXT.filter(x=>x.t===s.id);
    p.innerHTML=`<div class="sec">What it does</div><div class="body">${s.what}</div>`+
      `<div class="sec">How it's built</div><div class="body">${s.how}</div>`+
      (ext.length?`<div class="sec">External services</div><div class="body">${ext.map(x=>`<b>${x.n}</b> — ${x.d}`).join('<br>')}</div>`:'')+
      (s.talks&&s.talks.length?`<div class="sec">Talks to</div><div class="chips">${s.talks.map(x=>
        byId[x] ? `<span class="chip" data-g="${x}">${byId[x].name}</span>`
                : `<span class="chip ext" title="external service">${SVC[x]||x} ↗</span>`).join('')}</div>`:'');
    p.querySelectorAll('[data-g]').forEach(c=>c.onclick=()=>{sel=c.dataset.g;render()});
  } else {
    const o=OV[lens];
    t.textContent=o[0]; m.textContent='perspective';
    p.innerHTML=`<div class="sec">What you're looking at</div><div class="body">${o[1]}</div>`+
      `<div class="sec">Worth knowing</div><div class="body">${o[2]}</div>`;
  }

  document.getElementById('stats').innerHTML=STATS.join('<br>');

  const sq=document.getElementById('seq');
  sq.classList.toggle('on',lens==='seq');
  // The sequence tray occupies the same corner as the stats block.
  document.getElementById('stats').style.display = lens==='seq' ? 'none' : '';
  if(lens==='seq'){
    const q=SEQ[step];
    document.getElementById('seqmark').textContent=q[0];
    document.getElementById('seqloc').textContent=q[1];
    document.getElementById('seqtxt').innerHTML=`<b>${q[2]}</b> — ${q[4]}`;
    document.getElementById('seqbar').innerHTML=SEQ.map((_,i)=>
      `<i class="${i<=step?'done':''}" data-i="${i}"></i>`).join('');
    document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{step=+b.dataset.i;render()});
  }
  draw();
}
document.getElementById('sprev').onclick=()=>{step=(step-1+SEQ.length)%SEQ.length;render()};
document.getElementById('snext').onclick=()=>{step=(step+1)%SEQ.length;render()};
addEventListener('keydown',e=>{
  if(lens!=='seq')return;
  if(e.key==='ArrowRight'){step=(step+1)%SEQ.length;render()}
  if(e.key==='ArrowLeft'){step=(step-1+SEQ.length)%SEQ.length;render()}
});
function boot(){
  const h=location.hash;
  let m;
  if(m=h.match(/lens=(\w+)/)) lens=m[1];
  if(h.includes('seq=')) lens='seq';
  if(m=h.match(/step=(\d+)/)) step=Math.min(+m[1],SEQ.length-1);
  if(m=h.match(/sel=(\w+)/)) sel=m[1];
  render();
}
addEventListener('hashchange',boot);
boot();
</script>
