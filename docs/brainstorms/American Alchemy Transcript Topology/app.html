<!DOCTYPE html>
<html lang="en" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <title>American Alchemy — Transcript Topology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════
       CSS Custom Properties
       ═══════════════════════════════════════════════ */
    :root {
      --bg: #0a0a0f;
      --bg-panel: rgba(8, 8, 7, 0.88);
      --border: #cd6d13;
      --text: #e8cea6;
      --text-dim: #cd8218;
      --text-bright: #ffeab8;
      --mono: 'JetBrains Mono', monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --blue: #d07b1b;
      --cyan: #d4a843;
      --light-cyan: #e8c46a;
      --indigo: #c47a43;
      --amber: #d4a843;
    }

    /* ═══════════════════════════════════════════════
       Reset & Base
       ═══════════════════════════════════════════════ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    .hidden {
      display: none !important;
    }

    /* ═══════════════════════════════════════════════
       Setup Screen
       ═══════════════════════════════════════════════ */
    #setup {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #setup-title {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    #setup-subtitle {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: -10px;
      margin-bottom: 16px;
    }

    #setup-tagline {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: -6px 0 18px 0;
      max-width: 480px;
      text-align: center;
      line-height: 1.6;
    }

    #setup-footer {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.10em;
      color: var(--text-dim);
      opacity: 0.6;
      margin-top: 28px;
      text-align: center;
      max-width: 480px;
    }

    #launch-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 14px 36px;
      width: 360px;
      box-sizing: border-box;
      cursor: pointer;
      transition: border-color 200ms ease, color 200ms ease, background 200ms ease;
    }

    #launch-btn:hover {
      border-color: var(--blue);
      color: var(--text-bright);
      background: rgba(205, 109, 19, 0.06);
    }

    .link-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 8px;
      cursor: pointer;
      margin-top: 4px;
    }

    .link-btn:hover {
      color: var(--text-bright);
    }

    #api-key-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    #api-key-input {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 14px;
      width: 320px;
      box-sizing: border-box;
      letter-spacing: 0.04em;
      transition: border-color 200ms ease;
    }

    #api-key-input::placeholder {
      color: var(--text-dim);
    }

    #api-key-input:focus {
      border-color: var(--blue);
    }

    #pick-folder-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 10px 24px;
      width: 320px;
      box-sizing: border-box;
      cursor: pointer;
      transition: border-color 200ms ease, color 200ms ease;
    }

    #pick-folder-btn:hover {
      border-color: var(--blue);
      color: var(--text-bright);
    }

    #load-cache-btn {
      background: transparent;
      border: 1px solid var(--blue);
      border-radius: 0;
      color: var(--blue);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 10px 24px;
      width: 320px;
      box-sizing: border-box;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }

    #load-cache-btn:hover {
      background: var(--blue);
      color: var(--text-bright);
    }

    #setup-status {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      min-height: 1.4em;
      margin-top: 8px;
    }

    /* ═══════════════════════════════════════════════
       Main View
       ═══════════════════════════════════════════════ */

    /* -- Graph container -- */
    #graph {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* -- Title (top-left) -- */
    #title {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      pointer-events: none;
    }

    #reanalyze-btn {
      position: fixed;
      top: 40px;
      left: 20px;
      z-index: 10;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 200ms ease, color 200ms ease;
    }

    #reanalyze-btn:hover {
      border-color: var(--amber);
      color: var(--amber);
    }

    /* -- Search bar -- */
    #search-bar {
      position: fixed;
      top: 50px;
      left: 20px;
      z-index: 11;
      width: 360px;
    }
    #search-input {
      background: var(--bg-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 8px 12px;
      width: 100%;
      box-sizing: border-box;
      border-radius: 0;
    }
    #search-input::placeholder { color: var(--text-dim); letter-spacing: 0.10em; }
    #search-input:focus { outline: none; border-color: var(--blue); }
    #search-results {
      margin-top: 4px;
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      max-height: 360px;
      overflow-y: auto;
    }
    .sr-item {
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--text);
      cursor: pointer;
      border-bottom: 1px solid rgba(205, 109, 19, 0.12);
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .sr-item:hover { background: rgba(205, 109, 19, 0.08); color: var(--text-bright); }
    .sr-kind {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      text-transform: uppercase;
      flex-shrink: 0;
      width: 56px;
    }
    .sr-name { flex: 1; }
    .sr-snippet {
      display: block;
      color: var(--text-dim);
      font-size: 10px;
      margin-top: 3px;
      line-height: 1.4;
    }

    /* -- Kind filter (top-right) -- */
    #kind-filter {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .kf-btn {
      background: var(--bg-panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 0;
      transition: color 150ms ease, border-color 150ms ease, background 150ms ease;
    }
    .kf-btn.active { color: var(--text-bright); border-color: var(--blue); background: rgba(208, 123, 27, 0.10); }
    .kf-btn:hover { color: var(--text); }
    .kf-btn.ghost { opacity: 0.75; }
    .kf-btn.ghost:hover { opacity: 1; }

    /* -- Missing modal -- */
    #missing-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 5, 5, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    #missing-modal .modal-card {
      background: #0a0807;
      border: 1px solid var(--border);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(208, 123, 27, 0.15);
      max-width: 720px;
      width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 101;
    }
    #missing-modal .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    #missing-modal .card-title {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--text-bright);
    }
    #missing-modal .card-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }
    #missing-modal .card-close:hover { color: var(--text-bright); }
    #missing-list {
      overflow-y: auto;
      padding: 8px 18px 18px;
      font-family: var(--mono);
    }
    .missing-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(205, 109, 19, 0.15);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .missing-item .mi-title { color: var(--text); }
    .missing-item .mi-meta {
      display: block;
      margin-top: 4px;
      color: var(--text-dim);
      font-size: 10px;
    }
    .missing-item a { color: var(--blue); text-decoration: none; }
    .missing-item a:hover { color: var(--text-bright); }

    /* -- Topology Switcher (top-center) -- */
    #controls {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: stretch;
      background: var(--bg-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 0;
      z-index: 10;
    }

    #controls button {
      background: transparent;
      color: var(--text-dim);
      border: none;
      padding: 8px 18px;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 200ms ease, border-color 200ms ease;
    }

    #controls button:hover {
      color: var(--text);
    }

    #controls button.active {
      color: var(--text-bright);
      border-bottom-color: var(--blue);
    }

    /* Dividers between control buttons */
    #controls button + button {
      border-left: 1px solid var(--border);
    }

    /* -- Info Panel (left side: network stats + clusters + key hint) -- */
    #info-panel {
      position: fixed;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      z-index: 10;
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      pointer-events: none;
      min-width: 180px;
    }

    .info-section {
      padding: 7px 12px;
    }

    .info-section + .info-section {
      border-top: 1px solid var(--border);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 2px;
      line-height: 1.5;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-key {
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .info-val {
      color: var(--text-bright);
      text-align: right;
    }

    #key-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      opacity: 0.5;
      pointer-events: none;
      z-index: 10;
    }

    /* -- Layout Description (below controls) -- */
    #layout-desc {
      position: fixed;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      pointer-events: none;
      white-space: nowrap;
    }

    /* -- Boot Status Overlay (centered) -- */
    #boot-status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    #boot-stage {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text);
    }

    #boot-detail {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    /* -- Side Panel (Detail Card) -- */
    #detail-card {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--panel-width, 360px);
      height: 100vh;
      overflow-y: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-left: 1px solid var(--border);
      z-index: 15;
      padding: 20px;
      transform: translateX(100%);
      transition: transform 300ms ease;
    }

    #detail-card.visible {
      transform: translateX(0);
    }

    /* -- Panel Resize Handle -- */
    #panel-resize {
      position: fixed;
      top: 0;
      width: 5px;
      height: 100vh;
      cursor: col-resize;
      z-index: 16;
      background: transparent;
      transition: background 150ms ease;
      display: none;
    }

    #panel-resize:hover,
    #panel-resize.dragging {
      background: var(--blue);
    }

    /* Scrollbar styling for detail card */
    #detail-card::-webkit-scrollbar {
      width: 4px;
    }

    #detail-card::-webkit-scrollbar-track {
      background: transparent;
    }

    #detail-card::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-title {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-bright);
      letter-spacing: 0.04em;
      word-break: break-word;
    }

    #card-close {
      background: transparent;
      border: none;
      border-radius: 0;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 16px;
      cursor: pointer;
      padding: 0 0 0 8px;
      line-height: 1;
      transition: color 200ms ease;
      flex-shrink: 0;
    }

    #card-close:hover {
      color: var(--text-bright);
    }

    #card-cluster {
      margin-bottom: 10px;
    }

    .cluster-badge {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 0;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      color: var(--text);
    }

    #card-meta {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      font-size: 11px;
      line-height: 1.6;
      margin-bottom: 2px;
    }

    .meta-key {
      font-family: var(--mono);
      color: var(--text-dim);
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .meta-val {
      font-family: var(--sans);
      color: var(--text);
      word-break: break-word;
    }

    .meta-val a {
      color: var(--blue);
      text-decoration: none;
    }

    #card-preview {
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
      word-break: break-word;
    }

    /* Kind labels (topic / person / episode) inline tags */
    .kind-label {
      display: inline-block;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      padding: 2px 6px;
      margin-right: 6px;
      border: 1px solid currentColor;
      vertical-align: middle;
    }
    .kind-label.kind-episode { color: #c45c3e; }
    .kind-label.kind-topic   { color: #d4a843; }
    .kind-label.kind-person  { color: #e8c46a; }

    .conn-name.kind-topic  { color: #d4a843; }
    .conn-name.kind-person { color: #e8c46a; }

    /* Section headings inside the detail card */
    .section-head {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin: 14px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(205, 109, 19, 0.18);
    }

    /* Chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    .chip {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }
    .chip em {
      color: var(--text-dim);
      font-style: normal;
      margin-left: 4px;
    }
    .chip-topic  { border-color: #cd6d13; }
    .chip-person { border-color: #d4a843; }
    .chip:hover { background: rgba(205, 109, 19, 0.10); color: var(--text-bright); }

    /* Excerpts */
    .excerpts { display: flex; flex-direction: column; gap: 10px; }
    .excerpt {
      font-family: var(--sans);
      font-size: 12px;
      line-height: 1.55;
      color: var(--text);
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(205, 109, 19, 0.15);
    }
    .excerpt:last-child { border-bottom: none; }
    .excerpt .ts {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--blue);
      text-decoration: none;
      margin-right: 8px;
      padding: 1px 5px;
      border: 1px solid var(--border);
    }
    .excerpt .ts:hover { background: var(--blue); color: var(--text-bright); }
    .excerpt .ex-topic {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      text-transform: uppercase;
      cursor: pointer;
    }
    .excerpt .ex-topic:hover { color: var(--text-bright); }
    .excerpt .ex-text {
      margin-top: 4px;
      color: var(--text);
      font-style: italic;
    }
    .excerpt code {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      background: rgba(205, 109, 19, 0.08);
      padding: 1px 4px;
    }
    .meta-val code {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text);
      background: rgba(205, 109, 19, 0.10);
      padding: 1px 5px;
      margin: 0 2px 2px 0;
      display: inline-block;
    }

    #card-connections {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
    }

    .conn-header {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .conn-item {
      font-size: 11px;
      line-height: 1.4;
      padding: 8px 0;
      border-bottom: 1px solid rgba(26, 42, 58, 0.5);
    }

    .conn-item:last-child {
      border-bottom: none;
    }

    .conn-edge {
      font-family: var(--mono);
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 3px;
    }

    .conn-edge .arrow {
      color: var(--text-dim);
      opacity: 0.6;
    }

    .conn-edge .label {
      font-family: var(--sans);
      font-style: italic;
      color: var(--text-dim);
    }

    .conn-name {
      font-family: var(--mono);
      color: var(--text);
      display: block;
      padding-left: 16px;
      font-size: 11px;
      cursor: pointer;
      transition: color 150ms ease;
    }

    .conn-name:hover {
      color: var(--text-bright);
    }

    /* -- Markers (medoid, LLM center) -- */
    .marker.medoid {
      color: #ef4444;
    }

    .marker.llm-center {
      color: #fb923c;
    }

    /* -- Cluster Labels Overlay -- */
    #cluster-labels {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }

    .cluster-label {
      position: absolute;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      pointer-events: none;
    }

    /* -- Legend items inside info-panel -- */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      line-height: 1.5;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 0;
      flex-shrink: 0;
    }

    .legend-label {
      font-size: 11px;
      color: var(--text-bright);
      white-space: nowrap;
    }

    .legend-special {
      border-top: 1px solid var(--border);
      margin-top: 5px;
      padding-top: 5px;
    }

    /* -- Scene Tooltip -- */
    .scene-tooltip {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      background: var(--bg-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 6px 10px;
      color: var(--text);
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════
       Reduced Motion
       ═══════════════════════════════════════════════ */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ═══════════════════════════════════════════════
       Config Panel
       ═══════════════════════════════════════════════ */
    /* ── CSS2D node labels ── */
    .node-label {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.3;
      color: #f4e7cd;
      pointer-events: none;
      padding-left: 1.1em;
      text-indent: -1.1em;
      white-space: nowrap;
      opacity: 1.0;
      transition: opacity 0.15s ease;
    }
    .node-label .nl-bullet {
      font-size: 9px;
      vertical-align: 1px;
    }
    .node-label--special {
      color: #eedcb0;
      opacity: 0.7;
    }

    /* Square-only mode — hide text, show just the bullet */
    .squares-only .node-label {
      padding-left: 0;
      text-indent: 0;
      text-align: center;
    }
    .squares-only .node-label .nl-text { display: none; }
    .squares-only .node-label .nl-bullet { font-size: 12px; }

    #theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background: var(--bg-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 8px 14px;
      cursor: pointer;
      transition: color 200ms ease, border-color 200ms ease;
    }
    #theme-toggle:hover {
      color: var(--text);
      border-color: var(--blue);
    }

  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       Setup Screen
       ═══════════════════════════════════════════════ -->
  <div id="setup">
    <div id="setup-title">AMERICAN ALCHEMY</div>
    <div id="setup-subtitle">TRANSCRIPT TOPOLOGY // v1.0</div>
    <div id="setup-tagline">115 episodes · disclosure · physics · consciousness · esoterica</div>
    <button id="launch-btn">ENTER THE TOPOLOGY</button>
    <button id="missing-btn-setup" class="link-btn">12 UNAVAILABLE EPISODES &rarr;</button>
    <div id="setup-status"></div>
    <div id="setup-footer">Jesse Michels &middot; topology derived deterministically from transcripts</div>
  </div>

  <!-- ═══════════════════════════════════════════════
       Main View
       ═══════════════════════════════════════════════ -->
  <div id="main" class="hidden">

    <!-- Graph container -->
    <div id="graph" style="position:absolute;inset:0;z-index:1;"></div>

    <!-- Title: top-left -->
    <div id="title">AMERICAN ALCHEMY · TRANSCRIPT TOPOLOGY</div>
    <button id="reanalyze-btn" class="hidden">RE-ANALYZE</button>

    <!-- Search + filter strip: top-left, below title -->
    <div id="search-bar">
      <input id="search-input" type="text" placeholder="SEARCH EPISODES, TOPICS, PEOPLE, EXCERPTS…" autocomplete="off" spellcheck="false">
      <div id="search-results" class="hidden"></div>
    </div>

    <!-- Kind filter pills: top-right -->
    <div id="kind-filter">
      <button class="kf-btn active" data-kind="episode">EPISODES</button>
      <button class="kf-btn active" data-kind="topic">TOPICS</button>
      <button class="kf-btn active" data-kind="person">PEOPLE</button>

      <button id="export-btn" class="kf-btn ghost">EXPORT JSON</button>
    </div>

    <!-- Missing list modal -->
    <div id="missing-modal" class="hidden">
      <div class="modal-card">
        <div class="card-header">
          <div class="card-title">UNAVAILABLE EPISODES</div>
          <button id="missing-close" class="card-close">&times;</button>
        </div>
        <div id="missing-list"></div>
      </div>
    </div>

    <!-- Topology Switcher: top-center -->
    <div id="controls">
      <button class="active" data-layout="central">CENTRALIZED</button>
      <button data-layout="decentral">DECENTRALIZED</button>
      <button data-layout="distrib">DISTRIBUTED</button>
    </div>

    <!-- Info Panel: left side (unified readouts + legend + key hint) -->
    <div id="info-panel">
      <div class="info-section">
        <div class="info-row"><span class="info-key">NODES</span><span class="info-val" id="readout-nodes">0</span></div>
        <div class="info-row"><span class="info-key">EDGES</span><span class="info-val" id="readout-edges">0</span></div>
        <div class="info-row"><span class="info-key">K-NN</span><span class="info-val" id="readout-knn">5</span></div>
      </div>
      <div class="info-section">
        <div id="legend"></div>
      </div>
    </div>

    <div id="key-hint">H — RECENTER</div>

    <!-- Layout Description: below controls -->
    <div id="layout-desc"></div>

    <!-- Boot Status Overlay: centered -->
    <div id="boot-status">
      <div id="boot-stage">INITIALIZING</div>
      <div id="boot-detail"></div>
    </div>

    <!-- Side Panel -->
    <div id="panel-resize"></div>
    <div id="detail-card">
      <div class="card-header">
        <div id="card-title" class="card-title"></div>
        <button id="card-close">&times;</button>
      </div>
      <div id="card-cluster">
        <span class="cluster-badge"></span>
      </div>
      <div id="card-meta"></div>
      <div id="card-preview"></div>
      <div id="card-connections">
        <div class="conn-header">CONNECTIONS</div>
      </div>
    </div>

    <!-- Cluster Labels Overlay -->
    <div id="cluster-labels"></div>

    <!-- Config Panel: bottom-right -->
    <button id="theme-toggle" title="Switch color theme">WARM</button>

  </div><!-- /main -->

  <script type="module">
    import { UMAP } from 'https://esm.sh/umap-js@1.4.0';
    import ForceGraph3D from 'https://esm.sh/3d-force-graph@1';
    import * as THREE from 'https://esm.sh/three@0.170.0';
    import { CSS2DRenderer, CSS2DObject } from 'https://esm.sh/three@0.170.0/addons/renderers/CSS2DRenderer.js';
    import { EffectComposer } from 'https://esm.sh/three@0.170.0/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://esm.sh/three@0.170.0/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://esm.sh/three@0.170.0/addons/postprocessing/UnrealBloomPass.js';

    // ═══════════════════════════════════════════════
    // TRANSCRIPT TOPOLOGY — pre-computed data loader
    //
    // The original Gemini-pipeline branch (embedding,
    // clustering, k-NN, edge labeling) is preserved
    // below as runPipeline() in case someone wants
    // to re-derive a topology from arbitrary markdown.
    // For the American Alchemy corpus we ship a
    // deterministically-built data/topology.json so
    // no API key is required.
    // ═══════════════════════════════════════════════

    let TOPOLOGY = null;        // the loaded JSON payload
    let TOPIC_EXCERPTS = {};    // topic_id -> [excerpts]
    let PERSON_EXCERPTS = {};   // person name -> [excerpts]
    let MISSING_LIST = [];

    // Kind visibility (toggled via top-right pill filter)
    const visibleKinds = { episode: true, topic: true, person: true };

    // No-op stubs for retained-but-unused Gemini pipeline below.
    async function saveSession() { /* noop — transcript topology is read-only */ }
    function getSavedApiKey() { return ''; }
    function saveApiKey() {}

    // ── Load + Launch ──────────────────────────────
    const setupStatus = document.getElementById('setup-status');
    const launchBtn = document.getElementById('launch-btn');

    async function loadTopology() {
      if (TOPOLOGY) return TOPOLOGY;
      setupStatus.textContent = 'LOADING TOPOLOGY…';
      const res = await fetch('./data/topology.json', { cache: 'force-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      TOPOLOGY = await res.json();
      TOPIC_EXCERPTS = TOPOLOGY.topic_excerpts || {};
      PERSON_EXCERPTS = TOPOLOGY.person_excerpts || {};
      MISSING_LIST = TOPOLOGY.missing || [];
      return TOPOLOGY;
    }

    async function hydrateAndRender() {
      const t = await loadTopology();

      // Hide setup, show main
      document.getElementById('setup').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      showBootStatus();
      setBootStage('INITIALIZING SCOPE…', `${t.stats.episodes} EPISODES · ${t.stats.topics} TOPICS · ${t.stats.people} PEOPLE`);

      // Apply theme + cluster colors before rendering
      applyTheme(currentTheme);
      // Expand CLUSTER_COLORS to match data K
      ensureClusterColors(t.stats.k_clusters);

      const clusterNames = {};
      for (const [k, v] of Object.entries(t.cluster_names || {})) clusterNames[Number(k)] = v;

      // Prepare nodes and edges. Topology coords live in roughly
      // ±300 range; the SCALE-multiplier position-force assumes
      // ±1. So normalize by 300 once here.
      const COORD_DIV = 300;
      allNodes = t.nodes.map(n => ({
        ...n,
        x_central:   (n.x_central   || 0) / COORD_DIV,
        y_central:   (n.y_central   || 0) / COORD_DIV,
        z_central:   (n.z_central   || 0) / COORD_DIV,
        x_decentral: (n.x_decentral || 0) / COORD_DIV,
        y_decentral: (n.y_decentral || 0) / COORD_DIV,
        z_decentral: (n.z_decentral || 0) / COORD_DIV,
        x_distrib:   (n.x_distrib   || 0) / COORD_DIV,
        y_distrib:   (n.y_distrib   || 0) / COORD_DIV,
        z_distrib:   (n.z_distrib   || 0) / COORD_DIV,
      }));
      edgeSets = {
        central: (t.edges.central || []).map(e => ({ ...e, topology: 'central' })),
        decentral: (t.edges.decentral || []).map(e => ({ ...e, topology: 'decentral' })),
        distrib: (t.edges.distrib || []).map(e => ({ ...e, topology: 'distrib' })),
      };

      const combined = [...edgeSets.central, ...edgeSets.decentral, ...edgeSets.distrib];
      initGraph(allNodes, combined);
      buildLegend(clusterNames);
      buildClusterLabels(clusterNames);
      buildReadouts(allNodes.length, edgeSets[currentLayout].length);
      buildSearchIndex();
      buildMissingList();
      // Apply kind-filter from the very first frame
      Graph.linkVisibility(link => link.topology === currentLayout && passKindFilter(link));
      Graph.nodeVisibility(n => !!visibleKinds[n.kind || 'episode']);

      setBootStage(`SCOPE ONLINE // ${t.stats.episodes} EPISODES // ${t.stats.topics} TOPICS // ${t.stats.people} PEOPLE`, '');
      setTimeout(hideBootStatus, 1800);
    }

    launchBtn.addEventListener('click', () => {
      hydrateAndRender().catch(err => {
        setupStatus.textContent = 'ERROR: ' + err.message;
        console.error(err);
      });
    });

    // Auto-launch if URL has #auto
    if (location.hash.includes('auto')) {
      setTimeout(() => launchBtn.click(), 50);
    }

    // RE-ANALYZE = re-fetch topology.json (forces network bypass of cache)
    document.getElementById('reanalyze-btn').addEventListener('click', async () => {
      TOPOLOGY = null;
      try {
        showBootStatus();
        setBootStage('RELOADING TOPOLOGY…', '');
        const res = await fetch('./data/topology.json', { cache: 'no-cache' });
        TOPOLOGY = await res.json();
        TOPIC_EXCERPTS = TOPOLOGY.topic_excerpts || {};
        PERSON_EXCERPTS = TOPOLOGY.person_excerpts || {};
        MISSING_LIST = TOPOLOGY.missing || [];
        ensureClusterColors(TOPOLOGY.stats.k_clusters);
        const clusterNames = {};
        for (const [k, v] of Object.entries(TOPOLOGY.cluster_names || {})) clusterNames[Number(k)] = v;
        const COORD_DIV = 300;
        allNodes = TOPOLOGY.nodes.map(n => ({
          ...n,
          x_central:   (n.x_central   || 0) / COORD_DIV,
          y_central:   (n.y_central   || 0) / COORD_DIV,
          z_central:   (n.z_central   || 0) / COORD_DIV,
          x_decentral: (n.x_decentral || 0) / COORD_DIV,
          y_decentral: (n.y_decentral || 0) / COORD_DIV,
          z_decentral: (n.z_decentral || 0) / COORD_DIV,
          x_distrib:   (n.x_distrib   || 0) / COORD_DIV,
          y_distrib:   (n.y_distrib   || 0) / COORD_DIV,
          z_distrib:   (n.z_distrib   || 0) / COORD_DIV,
        }));
        edgeSets = {
          central: (TOPOLOGY.edges.central || []).map(e => ({ ...e, topology: 'central' })),
          decentral: (TOPOLOGY.edges.decentral || []).map(e => ({ ...e, topology: 'decentral' })),
          distrib: (TOPOLOGY.edges.distrib || []).map(e => ({ ...e, topology: 'distrib' })),
        };
        const combined = [...edgeSets.central, ...edgeSets.decentral, ...edgeSets.distrib];
        updateGraphData(allNodes, combined, true);
        Graph.linkVisibility(link => link.topology === currentLayout && passKindFilter(link));
        buildLegend(clusterNames);
        buildClusterLabels(clusterNames);
        buildReadouts(allNodes.length, edgeSets[currentLayout].length);
        buildSearchIndex();
        setBootStage(`SCOPE ONLINE // ${TOPOLOGY.stats.episodes} EPISODES`, 'RELOADED');
        setTimeout(hideBootStatus, 1500);
      } catch (err) {
        setBootStage('ERROR', err.message);
      }
    });

    // Show RE-ANALYZE for power users (button is hidden by default; opt-in via shortcut)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'R' && e.shiftKey && !e.metaKey && !e.ctrlKey) {
        document.getElementById('reanalyze-btn').classList.toggle('hidden');
      }
    });

    // Helper: ensure we have enough cluster colors for K clusters.
    function ensureClusterColors(k) {
      const baseWarm = ['#c45c3e', '#d4a843', '#a8523a', '#c47a43', '#8b3a2a', '#e87f1e', '#a37041'];
      while (CLUSTER_COLORS.length < k) {
        const i = CLUSTER_COLORS.length;
        CLUSTER_COLORS.push(baseWarm[i % baseWarm.length]);
      }
    }

    // ═══════════════════════════════════════════════
    // Transcript-topology UI: search, kind filter,
    // missing-list modal, export, chip navigation.
    // All of this runs against TOPOLOGY + allNodes
    // after hydrateAndRender() completes.
    // ═══════════════════════════════════════════════

    // ── Kind-aware link filter ────────────────────
    // Edges only pass when BOTH endpoints' kind is currently visible.
    function passKindFilter(link) {
      const srcId = (typeof link.source === 'object') ? link.source.id : link.source;
      const tgtId = (typeof link.target === 'object') ? link.target.id : link.target;
      const s = nodeById[srcId];
      const t = nodeById[tgtId];
      const sk = (s && s.kind) || 'episode';
      const tk = (t && t.kind) || 'episode';
      return visibleKinds[sk] && visibleKinds[tk];
    }

    function applyKindVisibility() {
      if (!Graph) return;
      Graph.nodeVisibility(n => !!visibleKinds[n.kind || 'episode']);
      Graph.linkVisibility(link => link.topology === currentLayout && passKindFilter(link));
    }

    // ── Search index ──────────────────────────────
    // Flat array of {id, name, kind, snippet} built once per hydrate.
    let SEARCH_INDEX = [];

    function buildSearchIndex() {
      SEARCH_INDEX = [];
      if (!TOPOLOGY) return;
      for (const n of TOPOLOGY.nodes) {
        let snippet = '';
        if (n.kind === 'episode') {
          const topics = (n.top_topics || []).slice(0, 4).map(t => t.id.replace(/-/g, ' ')).join(' · ');
          const people = (n.top_people || []).slice(0, 3).map(p => p.name).join(' · ');
          snippet = [topics, people].filter(Boolean).join(' // ');
        } else if (n.kind === 'topic') {
          snippet = `${n.episode_count || 0} EPISODES`;
        } else if (n.kind === 'person') {
          snippet = `${n.episode_count || 0} EPISODES`;
        }
        SEARCH_INDEX.push({
          id: n.id,
          name: n.name,
          kind: n.kind || 'episode',
          snippet,
          search_blob: (n.name + ' ' + snippet).toLowerCase(),
        });
      }
    }

    function renderSearchResults(matches) {
      const wrap = document.getElementById('search-results');
      if (!matches.length) { wrap.classList.add('hidden'); wrap.innerHTML = ''; return; }
      let html = '';
      for (const m of matches.slice(0, 40)) {
        html += `<div class="sr-item" data-node-id="${escapeHtml(m.id)}">`;
        html += `<span class="sr-kind kind-${m.kind}">${m.kind.toUpperCase()}</span>`;
        html += `<span class="sr-name">${escapeHtml(m.name)}`;
        if (m.snippet) html += `<span class="sr-snippet">${escapeHtml(m.snippet)}</span>`;
        html += `</span></div>`;
      }
      wrap.innerHTML = html;
      wrap.classList.remove('hidden');
    }

    function runSearch(qRaw) {
      const q = (qRaw || '').trim().toLowerCase();
      if (!q) { renderSearchResults([]); return; }
      const out = [];
      for (const row of SEARCH_INDEX) {
        if (!visibleKinds[row.kind]) continue;
        if (row.search_blob.indexOf(q) !== -1) out.push(row);
      }
      // Prefer matches that appear inside the node name (over snippet-only
      // matches) and prefer matches near the start of the name.
      const score = (s) => {
        const i = s.name.toLowerCase().indexOf(q);
        if (i === 0) return 0;          // name starts with query
        if (i > 0) return 1 + i / 200;  // name contains query
        return 10;                      // matched only via snippet
      };
      out.sort((a, b) => {
        const sa = score(a), sb = score(b);
        if (sa !== sb) return sa - sb;
        return a.name.length - b.name.length;
      });
      renderSearchResults(out);
    }

    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      searchInput.addEventListener('input', e => runSearch(e.target.value));
      searchInput.addEventListener('focus', e => { if (e.target.value) runSearch(e.target.value); });
      searchInput.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          e.target.value = '';
          renderSearchResults([]);
          e.target.blur();
        }
      });
    }

    // Search result click → jump to node
    document.getElementById('search-results').addEventListener('click', e => {
      const item = e.target.closest('.sr-item');
      if (!item) return;
      const node = nodeById[item.dataset.nodeId];
      if (!node) return;
      document.getElementById('search-results').classList.add('hidden');
      searchInput.value = '';
      handleNodeClick(node);
    });

    // Dismiss search dropdown when clicking outside
    document.addEventListener('click', e => {
      const bar = document.getElementById('search-bar');
      if (bar && !bar.contains(e.target)) {
        document.getElementById('search-results').classList.add('hidden');
      }
    });

    // ── Kind filter pills ─────────────────────────
    document.querySelectorAll('.kf-btn[data-kind]').forEach(btn => {
      btn.addEventListener('click', () => {
        const kind = btn.dataset.kind;
        visibleKinds[kind] = !visibleKinds[kind];
        btn.classList.toggle('active', visibleKinds[kind]);
        applyKindVisibility();
        // Refresh search dropdown to respect new filter
        if (searchInput && searchInput.value) runSearch(searchInput.value);
      });
    });

    // ── Missing-list modal ────────────────────────
    function buildMissingList() {
      const wrap = document.getElementById('missing-list');
      if (!wrap) return;
      if (!MISSING_LIST.length) {
        wrap.innerHTML = '<div class="missing-item">No missing entries.</div>';
        return;
      }
      let html = '';
      for (const m of MISSING_LIST) {
        const idx = m.playlist_index ? `#${String(m.playlist_index).padStart(3, '0')}` : '—';
        const title = m.title || m.name || '(untitled)';
        const reason = m.reason || 'transcript unavailable';
        const url = m.url || (m.video_id ? `https://www.youtube.com/watch?v=${m.video_id}` : '');
        html += `<div class="missing-item">`;
        html += `<div class="mi-title"><strong>${escapeHtml(idx)}</strong> &nbsp; ${escapeHtml(title)}</div>`;
        html += `<span class="mi-meta">REASON: ${escapeHtml(reason)}`;
        if (url) html += ` · <a href="${escapeHtml(url)}" target="_blank" rel="noopener">YOUTUBE &rarr;</a>`;
        html += `</span></div>`;
      }
      wrap.innerHTML = html;
      // Also update count badge if more/less than 12 (data source of truth)
      const mb = document.getElementById('missing-btn');
      if (mb) mb.textContent = `${MISSING_LIST.length} MISSING`;
      const mbs = document.getElementById('missing-btn-setup');
      if (mbs) mbs.textContent = `${MISSING_LIST.length} UNAVAILABLE EPISODES \u2192`;
    }

    function openMissingModal() {
      // Ensure data is loaded — even if user hasn't pressed ENTER yet.
      loadTopology().then(() => {
        buildMissingList();

    // ═══════════════════════════════════════════════
    // Gemini API — Embeddings & Generation
    // (Retained but unused for transcript topology.
    //  Keep for future folder-based workflows.)
    // ═══════════════════════════════════════════════
    const EMBED_MODEL = 'gemini-embedding-001';
    const EMBED_BATCH_SIZE = 20;

    async function embedTexts(texts, apiKey, onProgress) {
      const allEmbeddings = [];

      for (let i = 0; i < texts.length; i += EMBED_BATCH_SIZE) {
        const batch = texts.slice(i, i + EMBED_BATCH_SIZE);
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${EMBED_MODEL}:batchEmbedContents?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              requests: batch.map(text => ({
                model: `models/${EMBED_MODEL}`,
                content: { parts: [{ text }] },
              })),
            }),
          }
        );

        if (!response.ok) {
          const err = await response.json();
          throw new Error(`Embedding API error: ${err.error?.message || response.statusText}`);
        }

        const data = await response.json();
        const vectors = data.embeddings.map(e => e.values);
        allEmbeddings.push(...vectors);
        if (onProgress) onProgress(Math.min(i + EMBED_BATCH_SIZE, texts.length), texts.length);
      }

      return allEmbeddings;
    }

    const LLM_MODEL = 'gemini-2.5-flash';

    async function generateContent(prompt, apiKey, model = LLM_MODEL) {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
          }),
        }
      );

      if (!response.ok) {
        const err = await response.json();
        throw new Error(`LLM API error: ${err.error?.message || response.statusText}`);
      }

      const data = await response.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }

    // ═══════════════════════════════════════════════
    // Math Pipeline — Vector Ops, Clustering, PCA, k-NN
    // ═══════════════════════════════════════════════

    function dot(a, b) {
      let sum = 0;
      for (let i = 0; i < a.length; i++) sum += a[i] * b[i];
      return sum;
    }

    function vecNorm(a) {
      return Math.sqrt(dot(a, a));
    }

    function cosineDistance(a, b) {
      const d = dot(a, b) / (vecNorm(a) * vecNorm(b) + 1e-9);
      return 1 - d;
    }

    function cosineDistanceMatrix(embeddings) {
      const n = embeddings.length;
      const matrix = Array.from({ length: n }, () => new Float64Array(n));
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const d = cosineDistance(embeddings[i], embeddings[j]);
          matrix[i][j] = d;
          matrix[j][i] = d;
        }
      }
      return matrix;
    }

    function normalizeRange(arr) {
      let mn = Infinity, mx = -Infinity;
      for (const v of arr) { if (v < mn) mn = v; if (v > mx) mx = v; }
      const range = mx - mn || 1e-9;
      return arr.map(v => 2 * (v - mn) / range - 1);
    }

    function subtractVec(a, b) {
      return a.map((v, i) => v - b[i]);
    }

    function addVec(a, b) {
      return a.map((v, i) => v + b[i]);
    }

    function scaleVec(a, s) {
      return a.map(v => v * s);
    }

    function meanVec(vectors) {
      const n = vectors.length;
      const dim = vectors[0].length;
      const result = new Array(dim).fill(0);
      for (const v of vectors) {
        for (let i = 0; i < dim; i++) result[i] += v[i];
      }
      return result.map(v => v / n);
    }

    // --- KMeans Clustering (k-means++ init) ---

    function kmeans(embeddings, k, maxIter = 50) {
      const n = embeddings.length;
      const dim = embeddings[0].length;

      // k-means++ initialization
      const centroids = [];
      const used = new Set();
      let first = Math.floor(Math.random() * n);
      centroids.push([...embeddings[first]]);
      used.add(first);

      for (let c = 1; c < k; c++) {
        let bestIdx = 0, bestDist = -1;
        for (let i = 0; i < n; i++) {
          if (used.has(i)) continue;
          const minDist = Math.min(...centroids.map(cen => cosineDistance(embeddings[i], cen)));
          if (minDist > bestDist) { bestDist = minDist; bestIdx = i; }
        }
        centroids.push([...embeddings[bestIdx]]);
        used.add(bestIdx);
      }

      let labels = new Int32Array(n);

      for (let iter = 0; iter < maxIter; iter++) {
        let changed = false;
        for (let i = 0; i < n; i++) {
          let bestC = 0, bestD = Infinity;
          for (let c = 0; c < k; c++) {
            const d = cosineDistance(embeddings[i], centroids[c]);
            if (d < bestD) { bestD = d; bestC = c; }
          }
          if (labels[i] !== bestC) changed = true;
          labels[i] = bestC;
        }
        if (!changed) break;

        for (let c = 0; c < k; c++) {
          const members = [];
          for (let i = 0; i < n; i++) {
            if (labels[i] === c) members.push(embeddings[i]);
          }
          if (members.length > 0) centroids[c] = meanVec(members);
        }
      }

      return { labels: Array.from(labels), centroids };
    }

    // --- PCA 3D (power iteration) ---

    function pca3d(embeddings) {
      const n = embeddings.length;
      const dim = embeddings[0].length;
      const mean = meanVec(embeddings);
      const centered = embeddings.map(e => subtractVec(e, mean));
      const components = [];
      let residual = centered.map(row => [...row]);

      for (let comp = 0; comp < Math.min(3, n - 1); comp++) {
        let vec = Array.from({ length: dim }, () => Math.random() - 0.5);
        let vn = vecNorm(vec);
        vec = vec.map(v => v / vn);

        for (let iter = 0; iter < 100; iter++) {
          const projections = residual.map(row => dot(row, vec));
          const newVec = new Array(dim).fill(0);
          for (let i = 0; i < n; i++) {
            for (let j = 0; j < dim; j++) {
              newVec[j] += residual[i][j] * projections[i];
            }
          }
          vn = vecNorm(newVec);
          if (vn < 1e-12) break;
          vec = newVec.map(v => v / vn);
        }

        components.push(vec);
        const projections = residual.map(row => dot(row, vec));
        residual = residual.map((row, i) =>
          row.map((v, j) => v - projections[i] * vec[j])
        );
      }

      // Pad to 3 components if fewer
      while (components.length < 3) {
        components.push(new Array(dim).fill(0));
      }

      return centered.map(row => components.map(comp => dot(row, comp)));
    }

    // --- k-NN Edge Builder ---

    function knnEdges(distMatrix, k) {
      const n = distMatrix.length;
      const edgeSet = new Set();

      for (let i = 0; i < n; i++) {
        const neighbors = Array.from({ length: n }, (_, j) => j)
          .filter(j => j !== i)
          .sort((a, b) => distMatrix[i][a] - distMatrix[i][b])
          .slice(0, k);

        for (const j of neighbors) {
          const edge = i < j ? `${i},${j}` : `${j},${i}`;
          edgeSet.add(edge);
        }
      }

      return Array.from(edgeSet).map(e => {
        const [a, b] = e.split(',').map(Number);
        return [a, b];
      }).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    }

    // ═══════════════════════════════════════════════
    // Layout Computation — Centralized, Decentralized, Distributed
    // ═══════════════════════════════════════════════

    function fibonacciSphere(n) {
      const points = [];
      const goldenRatio = (1 + Math.sqrt(5)) / 2;
      for (let i = 0; i < n; i++) {
        const theta = Math.acos(1 - 2 * (i + 0.5) / n);
        const phi = 2 * Math.PI * i / goldenRatio;
        points.push([
          Math.sin(theta) * Math.cos(phi),
          Math.sin(theta) * Math.sin(phi),
          Math.cos(theta),
        ]);
      }
      return points;
    }

    function computeCentralizedLayout(embeddings, pcaCoords) {
      const n = embeddings.length;
      const centroid = meanVec(embeddings);

      // Find medoid (closest to centroid)
      let medoidIdx = 0, bestDist = Infinity;
      for (let i = 0; i < n; i++) {
        const d = cosineDistance(embeddings[i], centroid);
        if (d < bestDist) { bestDist = d; medoidIdx = i; }
      }

      // Spherical layout: PCA angles, cosine distance for radius
      const centerPca = pcaCoords[medoidIdx];
      const relative = pcaCoords.map(p => subtractVec(p, centerPca));

      const rPca = relative.map(r => Math.sqrt(r[0]**2 + r[1]**2 + r[2]**2) + 1e-9);
      const theta = relative.map((r, i) => Math.acos(Math.max(-1, Math.min(1, r[2] / rPca[i]))));
      const phi = relative.map(r => Math.atan2(r[1], r[0]));

      const distsFromMedoid = embeddings.map(e => cosineDistance(e, embeddings[medoidIdx]));
      const maxDist = Math.max(...distsFromMedoid) + 1e-9;
      const radii = distsFromMedoid.map(d => d / maxDist);

      const x = radii.map((r, i) => r * Math.sin(theta[i]) * Math.cos(phi[i]));
      const y = radii.map((r, i) => r * Math.sin(theta[i]) * Math.sin(phi[i]));
      const z = radii.map((r, i) => r * Math.cos(theta[i]));

      return {
        x: normalizeRange(x),
        y: normalizeRange(y),
        z: normalizeRange(z),
        medoidIdx,
      };
    }

    function computeDecentralizedLayout(embeddings, clusterLabels, k) {
      const n = embeddings.length;
      const hubPositions = fibonacciSphere(k).map(p => scaleVec(p, 0.6));
      const orbitRadius = 0.25;

      const x = new Array(n).fill(0);
      const y = new Array(n).fill(0);
      const z = new Array(n).fill(0);

      for (let c = 0; c < k; c++) {
        const indices = [];
        for (let i = 0; i < n; i++) {
          if (clusterLabels[i] === c) indices.push(i);
        }
        const nInCluster = indices.length;

        if (nInCluster === 0) continue;
        if (nInCluster === 1) {
          x[indices[0]] = hubPositions[c][0];
          y[indices[0]] = hubPositions[c][1];
          z[indices[0]] = hubPositions[c][2];
        } else if (nInCluster === 2) {
          const offset = orbitRadius * 0.3;
          x[indices[0]] = hubPositions[c][0] - offset;
          y[indices[0]] = hubPositions[c][1];
          z[indices[0]] = hubPositions[c][2];
          x[indices[1]] = hubPositions[c][0] + offset;
          y[indices[1]] = hubPositions[c][1];
          z[indices[1]] = hubPositions[c][2];
        } else {
          const clusterEmbeddings = indices.map(i => embeddings[i]);
          const localCoords = pca3d(clusterEmbeddings);
          const localMax = Math.max(...localCoords.flat().map(Math.abs)) + 1e-9;

          indices.forEach((idx, j) => {
            x[idx] = hubPositions[c][0] + (localCoords[j][0] / localMax) * orbitRadius;
            y[idx] = hubPositions[c][1] + (localCoords[j][1] / localMax) * orbitRadius;
            z[idx] = hubPositions[c][2] + (localCoords[j][2] / localMax) * orbitRadius;
          });
        }
      }

      return { x: normalizeRange(x), y: normalizeRange(y), z: normalizeRange(z) };
    }

    function computeDistributedLayout(embeddings, kNeighbors) {
      const umap = new UMAP({
        nComponents: 3,
        nNeighbors: Math.min(kNeighbors, embeddings.length - 1),
        minDist: 0.1,
        distanceFn: cosineDistance,
      });

      const coords = umap.fit(embeddings);

      return {
        x: normalizeRange(coords.map(c => c[0])),
        y: normalizeRange(coords.map(c => c[1])),
        z: normalizeRange(coords.map(c => c[2])),
      };
    }

    // ═══════════════════════════════════════════════
    // LLM Annotation Pipeline
    // ═══════════════════════════════════════════════

    async function nominateCenter(notes, apiKey) {
      const summaries = notes.map(n => `[${n.id}] ${n.text.slice(0, 150)}`).join('\n');

      const prompt = `I have a collection of personal notes. I want to find the ONE core idea that all others secretly orbit around — the gravitational center.

Here are all the notes:
${summaries}

Which ONE note (by its [id]) is the core idea that all others connect back to? Respond with:
- The note id (just the number)
- A 1-2 sentence explanation of why this is the center

Format:
CENTER: <id>
REASON: <explanation>`;

      const response = await generateContent(prompt, apiKey);
      const match = response.match(/CENTER:\s*(\d+)/);
      return match ? parseInt(match[1]) : 0;
    }

    async function nameClusters(notes, clusterLabels, k, apiKey) {
      let clusterInfo = '';
      for (let c = 0; c < k; c++) {
        const indices = clusterLabels.map((l, i) => l === c ? i : -1).filter(i => i >= 0);
        const clusterNotes = indices.map(i => `  [${notes[i].id}] ${notes[i].text.slice(0, 100)}`).join('\n');
        clusterInfo += `\nCLUSTER ${c} (${indices.length} notes):\n${clusterNotes}\n`;
      }

      const prompt = `I've clustered a collection of personal notes into ${k} groups. Name each cluster.

${clusterInfo}

For each cluster, give it a short name (2-4 words) that captures its theme.

Format:
CLUSTER 0: <name>
CLUSTER 1: <name>
...`;

      const response = await generateContent(prompt, apiKey);
      const names = {};
      for (const match of response.matchAll(/CLUSTER\s+(\d+):\s*(.+)/g)) {
        names[parseInt(match[1])] = match[2].trim().replace(/\*\*/g, '');
      }
      for (let c = 0; c < k; c++) {
        if (!names[c]) names[c] = `Cluster ${c}`;
      }
      return names;
    }

    const EDGE_LABEL_BATCH = 20;

    async function labelEdges(notes, edges, apiKey, onProgress) {
      const labeled = [];

      for (let i = 0; i < edges.length; i += EDGE_LABEL_BATCH) {
        const batch = edges.slice(i, i + EDGE_LABEL_BATCH);

        let pairsText = '';
        batch.forEach(([a, b], idx) => {
          pairsText += `\nPAIR ${idx}:\n  A [${a}]: ${notes[a].text.slice(0, 200)}\n  B [${b}]: ${notes[b].text.slice(0, 200)}\n`;
        });

        const prompt = `I have pairs of personal notes that are neighbors in an idea network. For each pair, describe the specific relationship in BOTH directions using short, actionable verb phrases (2-5 words).

Be specific and contextual — NOT generic labels like "relates to" or "is similar to". Think about HOW they connect:
- Does one inspire the other? ("could spark", "seeds the idea of")
- Is one a premise for the other? ("grounds", "is the foundation for")
- Do they contradict? ("tensions with", "challenges")
- Does one extend the other? ("builds on", "takes further")
- Does one reframe the other? ("reframes", "is the same thing seen from")

${pairsText}

Format (one line per pair):
PAIR 0: A→B: <verb phrase> | B→A: <verb phrase>
PAIR 1: A→B: <verb phrase> | B→A: <verb phrase>
...`;

        const response = await generateContent(prompt, apiKey);

        batch.forEach(([a, b], idx) => {
          const pattern = new RegExp(`PAIR\\s+${idx}:.*?A→B:\\s*(.+?)\\s*\\|\\s*B→A:\\s*(.+?)\\s*$`, 'm');
          const match = response.match(pattern);
          const fwd = match ? match[1].trim().replace(/\.$/, '') : 'connects to';
          const bwd = match ? match[2].trim().replace(/\.$/, '') : 'connects to';
          labeled.push({ source: a, target: b, label_forward: fwd, label_backward: bwd, topology: 'distrib' });
        });

        if (onProgress) onProgress(Math.min(i + EDGE_LABEL_BATCH, edges.length), edges.length);
      }

      return labeled;
    }

    // ═══════════════════════════════════════════════
    // Custom Node Rendering — CSS2D text labels
    // ═══════════════════════════════════════════════

    function wrapNodeLabel(name) {
      const words = (name || '').split(/\s+/).slice(0, 4);
      if (!words.length) return [];
      const maxChars = 12;
      const lines = [];
      let current = '';
      for (const word of words) {
        if (current && (current.length + 1 + word.length) > maxChars) {
          lines.push(current);
          current = word;
        } else {
          current = current ? current + ' ' + word : word;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    function createNodeObject(node) {
      const color = CLUSTER_COLORS[node.cluster_id % CLUSTER_COLORS.length];
      const isSpecial = node.is_medoid || node.is_llm_center;
      const baseScale = isSpecial ? VFX.nodeScaleSpecial.val : VFX.nodeScale.val;

      // Invisible hit-target sprite for raycasting
      const hitMat = new THREE.SpriteMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false,
      });
      const hitSprite = new THREE.Sprite(hitMat);
      hitSprite.scale.set(baseScale, baseScale, 1);

      const group = new THREE.Group();
      group.add(hitSprite);

      // CSS2D label — constant screen-space size regardless of zoom
      const lines = wrapNodeLabel(node.name);
      if (lines.length) {
        const div = document.createElement('div');
        div.className = 'node-label' + (isSpecial ? ' node-label--special' : '');
        div.style.color = VFX.labelColor.val;
        div.style.opacity = String(VFX.labelAlpha.val);
        let html = `<span class="nl-bullet" style="color:${color};opacity:${VFX.clusterAlpha.val}">\u25A0</span><span class="nl-text"> ${lines[0]}`;
        for (let i = 1; i < lines.length; i++) html += `<br>${lines[i]}`;
        html += '</span>';
        div.innerHTML = html;
        const labelObj = new CSS2DObject(div);
        group.add(labelObj);
        node.__labelDiv = div;
      }

      node.__baseScale = baseScale;
      return group;
    }

    function updateNodeAppearance(node, state) {
      const lbl = node.__labelDiv;
      if (!lbl) return;
      switch (state) {
        case 'hover':
          lbl.style.opacity = '1';
          break;
        case 'neighbor':
          lbl.style.opacity = String(Math.min(1, VFX.labelAlpha.val + 0.15));
          break;
        case 'dim':
          lbl.style.opacity = String(VFX.dimOpacity.val * 0.3);
          break;
        default:
          lbl.style.opacity = String(VFX.labelAlpha.val);
      }
    }

    // ═══════════════════════════════════════════════
    // VFX Refresh Helpers
    // ═══════════════════════════════════════════════

    let nodeRefreshTimer = null;

    function scheduleNodeRefresh() {
      clearTimeout(nodeRefreshTimer);
      nodeRefreshTimer = setTimeout(() => {
        if (!Graph) return;
        Graph.nodeThreeObject(node => createNodeObject(node));
      }, 80);
    }

    function refreshNodeScales() {
      // Group-based nodes have baseScale baked into children — full rebuild needed
      scheduleNodeRefresh();
    }

    function refreshLinks() {
      if (!Graph) return;
      Graph
        .linkColor(link => getLinkColor(link))
        .linkWidth(link => getLinkWidth(link))
        .linkOpacity(1.0)
        .linkDirectionalParticles(VFX.particleCount.val)
        .linkDirectionalParticleSpeed(VFX.particleSpeed.val)
        .linkDirectionalParticleWidth(VFX.particleWidth.val)
        .linkDirectionalParticleColor(() => `rgba(${hexToRgb(VFX.particleColor.val)},${VFX.particleAlpha.val})`)
        .linkCurvature(VFX.linkCurvatureVal.val)
        .linkHoverPrecision(VFX.linkHoverPrec.val);
    }

    function refreshPostFx() {
      if (!bloomPass) return;
      bloomPass.strength = VFX.bloomStrength.val;
      bloomPass.radius = VFX.bloomRadius.val;
      bloomPass.threshold = VFX.bloomThreshold.val;

    function refreshColors() {
      if (!Graph) return;
      // Background (with alpha)
      const bgRgb = hexToRgb(VFX.bgColor.val);
      Graph.backgroundColor(`rgba(${bgRgb},${VFX.bgAlpha.val})`);
      // Label text color + alpha (reset non-hovered labels to current alpha)
      document.querySelectorAll('.node-label').forEach(el => {
        el.style.color = VFX.labelColor.val;
        el.style.opacity = String(VFX.labelAlpha.val);
      });
      // Links + particles
      refreshLinks();

    function refreshClusters() {
      syncClusterColors();
      // Update legend dot colors
      document.querySelectorAll('[data-cluster-dot]').forEach(el => {
        const idx = parseInt(el.dataset.clusterDot);
        el.style.background = CLUSTER_COLORS[idx % CLUSTER_COLORS.length];
      });
      // Update floating cluster label colors
      Object.entries(clusterLabelEls).forEach(([id, el]) => {
        el.style.color = CLUSTER_COLORS[id % CLUSTER_COLORS.length];
      });
      // Rebuild node labels with new bullet colors
      scheduleNodeRefresh();

    function refreshChrome() {
      const root = document.documentElement;
      root.style.setProperty('--bg', VFX.chromeBg.val);
      root.style.setProperty('--bg-panel', `rgba(${hexToRgb(VFX.chromeBgPanel.val)},${VFX.chromeBgPanelA.val})`);
      root.style.setProperty('--border', VFX.chromeBorder.val);
      root.style.setProperty('--text', VFX.chromeText.val);
      root.style.setProperty('--text-dim', VFX.chromeTextDim.val);
      root.style.setProperty('--text-bright', VFX.chromeTextBright.val);
      root.style.setProperty('--blue', VFX.chromeAccent.val);
      root.style.setProperty('--cyan', VFX.chromeCyan.val);
      root.style.setProperty('--light-cyan', VFX.chromeLightCyan.val);
      root.style.setProperty('--indigo', VFX.chromeIndigo.val);
      root.style.setProperty('--amber', VFX.chromeAmber.val);
