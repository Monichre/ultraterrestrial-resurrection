    // ═══════════════════════════════════════════════
    // Pipeline Orchestrator
    // ═══════════════════════════════════════════════

    async function runPipeline(notes, apiKey, fingerprint) {
      try {
        // ── STAGE 1: SCANNING ──
        setBootStage('SCANNING...', `${notes.length} NOTES LOADED`);
        await sleep(300); // brief pause so user sees it

        // ── STAGE 2: EMBEDDING ──
        const texts = notes.map(n => n.text.slice(0, 2000));
        const embeddings = await embedTexts(texts, apiKey, (done, total) => {
          setBootStage('EMBEDDING...', `${done}/${total}`);
        });

        // ── STAGE 3: COMPUTING TOPOLOGY ──
        setBootStage('COMPUTING TOPOLOGY...', 'CLUSTERING');
        await sleep(50);
        const k = Math.min(N_CLUSTERS, notes.length);
        const { labels: clusterLabels } = kmeans(embeddings, k);

        setBootStage('COMPUTING TOPOLOGY...', 'PCA');
        await sleep(50);
        const pcaCoords = pca3d(embeddings);

        setBootStage('COMPUTING TOPOLOGY...', 'CENTRALIZED LAYOUT');
        await sleep(50);
        const central = computeCentralizedLayout(embeddings, pcaCoords);

        setBootStage('COMPUTING TOPOLOGY...', 'DECENTRALIZED LAYOUT');
        await sleep(50);
        const decentral = computeDecentralizedLayout(embeddings, clusterLabels, k);

        setBootStage('COMPUTING TOPOLOGY...', 'UMAP');
        await sleep(50);
        const distrib = computeDistributedLayout(embeddings, K_NEIGHBORS);

        setBootStage('COMPUTING TOPOLOGY...', 'K-NN EDGES');
        await sleep(50);
        const distMatrix = cosineDistanceMatrix(embeddings);
        const edges = knnEdges(distMatrix, K_NEIGHBORS);

        // ── Compute topology-specific edge sets ──

        // Centralized: star from medoid to every other node
        const centralEdges = [];
        for (let i = 0; i < notes.length; i++) {
          if (i === central.medoidIdx) continue;
          centralEdges.push({
            source: central.medoidIdx,
            target: i,
            label_forward: 'radiates to',
            label_backward: 'orbits center',
            topology: 'central',
          });
        }

        // Decentralized: find cluster medoids, connect hub→members + hub↔hub
        const clusterMedoids = {};
        for (let c = 0; c < k; c++) {
          const members = [];
          for (let i = 0; i < notes.length; i++) {
            if (clusterLabels[i] === c) members.push(i);
          }
          if (members.length === 0) continue;
          // Find cluster medoid (closest to cluster centroid)
          const clusterEmbs = members.map(i => embeddings[i]);
          const centroid = meanVec(clusterEmbs);
          let bestIdx = members[0], bestDist = Infinity;
          for (const i of members) {
            const d = cosineDistance(embeddings[i], centroid);
            if (d < bestDist) { bestDist = d; bestIdx = i; }
          }
          clusterMedoids[c] = bestIdx;
        }

        const decentralEdges = [];
        // Hub → members
        for (let c = 0; c < k; c++) {
          const hub = clusterMedoids[c];
          if (hub === undefined) continue;
          for (let i = 0; i < notes.length; i++) {
            if (clusterLabels[i] === c && i !== hub) {
              decentralEdges.push({
                source: hub,
                target: i,
                label_forward: 'governs',
                label_backward: 'belongs to hub',
                topology: 'decentral',
              });
            }
          }
        }
        // Hub ↔ hub
        const hubs = Object.values(clusterMedoids);
        for (let a = 0; a < hubs.length; a++) {
          for (let b = a + 1; b < hubs.length; b++) {
            decentralEdges.push({
              source: hubs[a],
              target: hubs[b],
              label_forward: 'bridges to',
              label_backward: 'bridges to',
              topology: 'decentral',
            });
          }
        }

        // ── Build node data ──
        const graphNodes = notes.map((note, i) => ({
          id: note.id,
          filename: note.filename,
          name: note.filename.replace(/\.(md|txt)$/i, ''),
          text_preview: note.text.slice(0, 600),
          cluster_id: clusterLabels[i],
          x_central: central.x[i],
          y_central: central.y[i],
          z_central: central.z[i],
          x_decentral: decentral.x[i],
          y_decentral: decentral.y[i],
          z_decentral: decentral.z[i],
          x_distrib: distrib.x[i],
          y_distrib: distrib.y[i],
          z_distrib: distrib.z[i],
          is_medoid: i === central.medoidIdx ? 1 : 0,
          is_llm_center: 0,
          cluster_name: '',
        }));

        // Initialize graph with white/uncolored nodes (no annotations yet)
        setBootStage('COMPUTING TOPOLOGY...', 'INITIALIZING GRAPH');
        await sleep(50);
        initGraph(graphNodes, []);

        // ── STAGE 4: ANNOTATING ──
        setBootStage('ANNOTATING...', 'CENTER NOMINATION');
        const llmCenterIdx = await nominateCenter(notes, apiKey);
        graphNodes.forEach(n => {
          n.is_llm_center = n.id === llmCenterIdx ? 1 : 0;
        });

        setBootStage('ANNOTATING...', 'CLUSTER NAMES');
        const clusterNames = await nameClusters(notes, clusterLabels, k, apiKey);
        graphNodes.forEach(n => {
          n.cluster_name = clusterNames[n.cluster_id] || `Cluster ${n.cluster_id}`;
        });

        // Update graph with cluster colors and names (refresh node objects for LLM center decoration)
        updateGraphData(graphNodes, [], true);

        // Progressive edge labeling — batch in the pipeline for incremental reveal
        const labeledEdges = [];
        for (let i = 0; i < edges.length; i += EDGE_LABEL_BATCH) {
          const batchEdges = edges.slice(i, i + EDGE_LABEL_BATCH);
          const batchResult = await labelEdges(notes, batchEdges, apiKey);
          labeledEdges.push(...batchResult);
          setBootStage('ANNOTATING...', `EDGE LABELS ${Math.min(i + EDGE_LABEL_BATCH, edges.length)}/${edges.length}`);
          // Show progressive edges during labeling
          updateGraphData(graphNodes, [...centralEdges, ...decentralEdges, ...labeledEdges]);
        }

        // Store edge sets for readout counts; combine all for the graph
        edgeSets = { central: centralEdges, decentral: decentralEdges, distrib: labeledEdges };
        allNodes = graphNodes;
        const combined = [...centralEdges, ...decentralEdges, ...labeledEdges];
        updateGraphData(graphNodes, combined);
        // Show only edges for the active topology
        Graph.linkVisibility(link => link.topology === currentLayout);

        // ── STAGE 5: ONLINE ──
        buildLegend(clusterNames);
        buildClusterLabels(clusterNames);
        const activeEdges = edgeSets[currentLayout] || [];
        buildReadouts(notes.length, activeEdges.length);

        // Cache session to IndexedDB — whitelist serialization to avoid Three.js/d3 objects
        const NODE_SAVE_KEYS = [
          'id', 'filename', 'name', 'text_preview', 'cluster_id', 'cluster_name',
          'x_central', 'y_central', 'z_central',
          'x_decentral', 'y_decentral', 'z_decentral',
          'x_distrib', 'y_distrib', 'z_distrib',
          'is_medoid', 'is_llm_center',
        ];
        const serializableNodes = graphNodes.map(n => {
          const clean = {};
          for (const k of NODE_SAVE_KEYS) if (n[k] !== undefined) clean[k] = n[k];
          return clean;
        });
        const serializeEdges = arr => arr.map(e => ({
          source: typeof e.source === 'object' ? e.source.id : e.source,
          target: typeof e.target === 'object' ? e.target.id : e.target,
          label_forward: e.label_forward || '',
          label_backward: e.label_backward || '',
        }));
        try {
          await saveSession({
            graphNodes: serializableNodes,
            labeledEdges: serializeEdges(labeledEdges),
            centralEdges: serializeEdges(centralEdges),
            decentralEdges: serializeEdges(decentralEdges),
            clusterNames,
            nodeCount: notes.length,
            fingerprint: fingerprint || '',
          });
          console.log('Cache saved:', serializableNodes.length, 'nodes');
        } catch (cacheErr) {
          console.error('Cache save failed:', cacheErr);
          setBootStage(`SCOPE ONLINE // ${notes.length} NODES // CACHE SAVE FAILED`, cacheErr.message);
        }

        setBootStage(`SCOPE ONLINE // ${notes.length} NODES // ${labeledEdges.length} EDGES`, '');
        setTimeout(hideBootStatus, 2000);

      } catch (err) {
        setBootStage('ERROR', err.message);
        console.error('Pipeline error:', err);
      }
    }

    // ═══════════════════════════════════════════════
    // 3D Graph Rendering + Scope Overlays
    // ═══════════════════════════════════════════════

    let Graph;
    let bloomPass;
    let currentLayout = 'central';
    let hoverNode = null;
    let selectedNode = null;
    let adjacency = {};
    let neighborSets = {};
    let nodeById = {};
    let allNodes = [];
    let edgeSets = { central: [], decentral: [], distrib: [] };

    // ── Lookup builders ──

    function rebuildLookups(nodes, edges) {
      adjacency = {};
      neighborSets = {};
      nodeById = {};
      nodes.forEach(n => { nodeById[n.id] = n; });
      edges.forEach(e => {
        if (!adjacency[e.source]) adjacency[e.source] = [];
        if (!adjacency[e.target]) adjacency[e.target] = [];
        adjacency[e.source].push({ id: e.target, label: e.label_forward });
        adjacency[e.target].push({ id: e.source, label: e.label_backward });
        if (!neighborSets[e.source]) neighborSets[e.source] = new Set();
        if (!neighborSets[e.target]) neighborSets[e.target] = new Set();
        neighborSets[e.source].add(e.target);
        neighborSets[e.target].add(e.source);
      });
    }

    // ── Custom position force ──

    function createPositionForce(strength) {
      let forceNodes;
      function force(alpha) {
        forceNodes.forEach(node => {
          const lk = 'x_' + currentLayout;
          const tx = (node[lk] || 0) * SCALE;
          const ty = (node['y_' + currentLayout] || 0) * SCALE;
          const tz = (node['z_' + currentLayout] || 0) * SCALE;
          node.vx += (tx - node.x) * strength * alpha;
          node.vy += (ty - node.y) * strength * alpha;
          node.vz += (tz - node.z) * strength * alpha;
        });
      }
      force.initialize = function(n) { forceNodes = n; };
      force.strength = function(s) {
        if (s === undefined) return strength;
        strength = s;
        return force;
      };
      return force;
    }

    // ── Color / style helpers ──

    function darken(hex, amount) {
      const r = Math.max(0, Math.round(parseInt(hex.slice(1, 3), 16) * (1 - amount)));
      const g = Math.max(0, Math.round(parseInt(hex.slice(3, 5), 16) * (1 - amount)));
      const b = Math.max(0, Math.round(parseInt(hex.slice(5, 7), 16) * (1 - amount)));
      return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function getNodeColor(node) {
      const color = CLUSTER_COLORS[node.cluster_id % CLUSTER_COLORS.length];
      if (hoverNode) {
        if (node === hoverNode) return '#ffffff';
        if (neighborSets[hoverNode.id]?.has(node.id)) return color;
        return darken(color, 0.3);
      }
      if (selectedNode) {
        if (node === selectedNode) return '#ffffff';
        return darken(color, 0.3);
      }
      return color;
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
    }

    function getLinkColor(link) {
      const rgb = hexToRgb(VFX.linkColor.val);
      const focus = hoverNode || selectedNode;
      if (focus) {
        const s = typeof link.source === 'object' ? link.source : nodeById[link.source];
        const t = typeof link.target === 'object' ? link.target : nodeById[link.target];
        if (s === focus || t === focus) return `rgba(${rgb},${VFX.linkOpacityHover.val})`;
        return `rgba(${rgb},0.02)`;
      }
      return `rgba(${rgb},${VFX.linkAlpha.val})`;
    }

    function getLinkWidth(link) {
      const focus = hoverNode || selectedNode;
      if (focus) {
        const s = typeof link.source === 'object' ? link.source : nodeById[link.source];
        const t = typeof link.target === 'object' ? link.target : nodeById[link.target];
        if (s === focus || t === focus) return VFX.linkWidthHover.val;
      }
      return VFX.linkWidthVal.val;
    }

    // ── Tooltip builders ──

    function buildNodeTooltip(node) {
      const markers = [];
      if (node.is_medoid) markers.push('<span style="color:#ef4444;font-size:10px;">MEDOID</span>');
      const kind = (node.kind || 'episode').toUpperCase();
      const kindColor = node.kind === 'topic' ? '#d4a843' : node.kind === 'person' ? '#e8c46a' : '#c45c3e';
      let subline = '';
      if (node.kind === 'episode') {
        subline = node.duration ? `${node.duration} · EP ${String(node.playlist_index || '').padStart(3,'0')}` : '';
      } else if (node.kind === 'topic' || node.kind === 'person') {
        subline = `${node.episode_count || 0} EPISODES`;
      }
      return `<div style="text-align:center;font-family:monospace;">`
        + `<div style="color:${kindColor};font-size:9px;letter-spacing:0.12em;">${kind}</div>`
        + `<div style="font-weight:600;margin-top:2px;">${escapeHtml(node.name)}</div>`
        + (subline ? `<div style="color:#888;font-size:10px;margin-top:2px;">${subline}</div>` : '')
        + `<div style="color:#4a6a8a;font-size:11px;margin-top:2px;">${escapeHtml(node.cluster_name || '')}</div>`
        + (markers.length ? `<div style="margin-top:3px;">${markers.join(' ')}</div>` : '')
        + '</div>';
    }

    function buildLinkTooltip(link) {
      const s = typeof link.source === 'object' ? link.source : nodeById[link.source];
      const t = typeof link.target === 'object' ? link.target : nodeById[link.target];
      if (!s || !t) return '';
      return `<div style="max-width:300px;font-family:monospace;">`
        + `<div>${escapeHtml(s.name)} → ${escapeHtml(t.name)}</div>`
        + `<div style="color:#4a6a8a;font-style:italic;">${escapeHtml(link.label_forward || '')}</div>`
        + `<div style="margin-top:6px;">${escapeHtml(t.name)} → ${escapeHtml(s.name)}</div>`
        + `<div style="color:#4a6a8a;font-style:italic;">${escapeHtml(link.label_backward || '')}</div>`
        + '</div>';
    }

    // ── Interaction handlers ──

    function handleNodeHover(node) {
      hoverNode = node || null;
      document.getElementById('graph').style.cursor = node ? 'pointer' : '';
      if (Graph) {
        Graph.graphData().nodes.forEach(n => {
          if (hoverNode) {
            // Hover: highlight node + neighbors
            if (n === hoverNode) updateNodeAppearance(n, 'hover');
            else if (neighborSets[hoverNode.id]?.has(n.id)) updateNodeAppearance(n, 'neighbor');
            else updateNodeAppearance(n, 'dim');
          } else if (selectedNode) {
            // Selection: only the selected node glows
            if (n === selectedNode) updateNodeAppearance(n, 'hover');
            else updateNodeAppearance(n, 'dim');
          } else {
            updateNodeAppearance(n, 'normal');
          }
        });
        Graph.linkColor(Graph.linkColor())
             .linkWidth(Graph.linkWidth());
      }
    }

    function handleNodeClick(node) {
      selectedNode = node;
      showDetailCard(node);

      // Apply selection highlighting — only selected node glows, rest dim
      Graph.graphData().nodes.forEach(n => {
        if (n === node) updateNodeAppearance(n, 'hover');
        else updateNodeAppearance(n, 'dim');
      });
      Graph.linkColor(Graph.linkColor())
           .linkWidth(Graph.linkWidth())
           .linkDirectionalParticles(0);

      // Focus camera
      const distance = 400;
      const mag = Math.hypot(node.x, node.y, node.z) || 1;
      const distRatio = 1 + distance / mag;
      Graph.cameraPosition(
        { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
        node,
        1200
      );
    }

    function handleBackgroundClick() {
      hideDetailCard();
    }

    // ── Side panel functions ──

    function parseFrontmatter(text) {
      const match = text.match(/^---\n([\s\S]*?)\n---\s*([\s\S]*)$/);
      if (!match) return { meta: null, body: text };

      const meta = {};
      let currentKey = null;
      for (const line of match[1].split('\n')) {
        const kvMatch = line.match(/^(\w[\w\s-]*):\s*(.*)$/);
        if (kvMatch) {
          currentKey = kvMatch[1].trim();
          const val = kvMatch[2].trim();
          if (val.startsWith('[') || val === '') {
            meta[currentKey] = val === '' ? '' : val;
          } else {
            meta[currentKey] = val;
          }
        } else if (currentKey && line.match(/^\s*-\s+/)) {
          // YAML list continuation
          const item = line.replace(/^\s*-\s+/, '').trim().replace(/^["']|["']$/g, '');
          const prev = meta[currentKey];
          meta[currentKey] = prev ? prev + ', ' + item : item;
        }
      }
      return { meta, body: match[2].trim() };
    }

    function renderMeta(meta) {
      if (!meta) return '';
      const skip = new Set(['cssclasses', 'tags']);
      let html = '';
      for (const [key, val] of Object.entries(meta)) {
        if (skip.has(key.toLowerCase()) || !val) continue;
        let rendered = escapeHtml(String(val)).replace(/\[\[([^\]]+)\]\]/g, '$1');
        // Auto-link URLs
        rendered = rendered.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">link</a>');
        html += `<div class="meta-row"><span class="meta-key">${escapeHtml(key)}:</span><span class="meta-val">${rendered}</span></div>`;
      }
      return html;
    }

    // ──────────────────────────────────────────────
    // Detail card — kind-aware
    // ──────────────────────────────────────────────

    function ytTimestampUrl(videoId, secs) {
      return `https://www.youtube.com/watch?v=${videoId}&t=${Math.max(0, Math.floor(secs))}s`;
    }
    function fmtTimestamp(secs) {
      const s = Math.max(0, Math.floor(secs));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const ss = s % 60;
      return (h ? `${h}:` : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(ss).padStart(2, '0');
    }

    function showDetailCard(node) {
      const card = document.getElementById('detail-card');
      const resize = document.getElementById('panel-resize');

      // Title
      const kindLabel = (node.kind || 'episode').toUpperCase();
      let title = `<span class="kind-label kind-${node.kind || 'episode'}">${kindLabel}</span> ` + escapeHtml(node.name);
      if (node.is_medoid) title += ' <span class="marker medoid">MEDOID</span>';
      document.getElementById('card-title').innerHTML = title;

      // Cluster badge
      const color = CLUSTER_COLORS[node.cluster_id % CLUSTER_COLORS.length];
      document.getElementById('card-cluster').innerHTML =
        `<span class="cluster-badge" style="border-color:${color};color:${color};">${escapeHtml(node.cluster_name || '')}</span>`;

      // Body builder per kind
      let metaHtml = '';
      let previewHtml = '';

      if (node.kind === 'episode') {
        const meta = {};
        if (node.playlist_index) meta['Episode'] = `#${String(node.playlist_index).padStart(3,'0')}`;
        if (node.duration) meta['Duration'] = node.duration;
        if (node.channel) meta['Channel'] = node.channel;
        if (node.paragraph_count) meta['Paragraphs'] = String(node.paragraph_count);
        if (node.url) meta['YouTube'] = `<a href="${node.url}" target="_blank" rel="noopener">${node.url}</a>`;
        if (node.video_id) meta['Video ID'] = node.video_id;
        metaHtml = Object.entries(meta).map(
          ([k, v]) => `<div class="meta-row"><span class="meta-key">${k}:</span><span class="meta-val">${v}</span></div>`
        ).join('');

        // Top topics
        if (Array.isArray(node.top_topics) && node.top_topics.length) {
          previewHtml += `<div class="section-head">TOP TOPICS</div><div class="chips">`;
          for (const t of node.top_topics) {
            previewHtml += `<span class="chip chip-topic" data-jump-id="topic-${t.id}">${escapeHtml(t.id.replace(/-/g, ' '))} <em>×${t.count}</em></span>`;
          }
          previewHtml += `</div>`;
        }
        if (Array.isArray(node.top_people) && node.top_people.length) {
          previewHtml += `<div class="section-head">PEOPLE MENTIONED</div><div class="chips">`;
          for (const p of node.top_people) {
            previewHtml += `<span class="chip chip-person" data-jump-name="${escapeHtml(p.name)}">${escapeHtml(p.name)} <em>×${p.count}</em></span>`;
          }
          previewHtml += `</div>`;
        }
        // Excerpts with timestamps
        if (Array.isArray(node.excerpts) && node.excerpts.length) {
          previewHtml += `<div class="section-head">EXCERPTS</div><div class="excerpts">`;
          for (const ex of node.excerpts) {
            const yt = node.video_id ? ytTimestampUrl(node.video_id, ex.t) : '#';
            previewHtml += `<div class="excerpt"><a class="ts" href="${yt}" target="_blank" rel="noopener">${fmtTimestamp(ex.t)}</a><span class="ex-topic">${escapeHtml((ex.topic||'').replace(/-/g, ' '))}</span><div class="ex-text">“${escapeHtml(ex.text)}”</div></div>`;
          }
          previewHtml += `</div>`;
        }
        // First paragraphs as cold-open
        if (!previewHtml && Array.isArray(node.first_paras) && node.first_paras.length) {
          previewHtml += `<div class="section-head">OPENING</div><div class="excerpts">`;
          for (const p of node.first_paras) {
            const yt = node.video_id ? ytTimestampUrl(node.video_id, p.t) : '#';
            previewHtml += `<div class="excerpt"><a class="ts" href="${yt}" target="_blank" rel="noopener">${fmtTimestamp(p.t)}</a><div class="ex-text">${escapeHtml(p.text)}</div></div>`;
          }
          previewHtml += `</div>`;
        }
      } else if (node.kind === 'topic') {
        // Topic node — list patterns + excerpts pulled across all episodes
        const patterns = (TOPOLOGY && TOPOLOGY.topic_vocabulary && TOPOLOGY.topic_vocabulary[node.topic_key]) || [];
        const meta = {
          'Episodes': String(node.episode_count || 0),
          'Cluster': node.cluster_name || '',
          'Match patterns': patterns.map(p => `<code>${escapeHtml(p.trim())}</code>`).join(', ') || '—',
        };
        metaHtml = Object.entries(meta).map(
          ([k, v]) => `<div class="meta-row"><span class="meta-key">${k}:</span><span class="meta-val">${v}</span></div>`
        ).join('');
        const exs = TOPIC_EXCERPTS[node.topic_key] || [];
        if (exs.length) {
          previewHtml += `<div class="section-head">EXCERPTS ACROSS ${exs.length} EPISODES</div><div class="excerpts">`;
          for (const ex of exs) {
            const yt = ex.video_id ? ytTimestampUrl(ex.video_id, ex.t) : '#';
            previewHtml += `<div class="excerpt"><a class="ts" href="${yt}" target="_blank" rel="noopener">${fmtTimestamp(ex.t)}</a><span class="ex-topic" data-jump-id="${ex.episode_id}">${escapeHtml(ex.episode_title.slice(0, 70))}</span><div class="ex-text">“${escapeHtml(ex.text)}”</div></div>`;
          }
          previewHtml += `</div>`;
        }
      } else if (node.kind === 'person') {
        const meta = {
          'Episodes': String(node.episode_count || 0),
          'Cluster': node.cluster_name || '',
        };
        metaHtml = Object.entries(meta).map(
          ([k, v]) => `<div class="meta-row"><span class="meta-key">${k}:</span><span class="meta-val">${v}</span></div>`
        ).join('');
        const exs = PERSON_EXCERPTS[node.name] || [];
        if (exs.length) {
          previewHtml += `<div class="section-head">MENTIONS ACROSS ${exs.length} EPISODES</div><div class="excerpts">`;
          for (const ex of exs) {
            const yt = ex.video_id ? ytTimestampUrl(ex.video_id, ex.t) : '#';
            previewHtml += `<div class="excerpt"><a class="ts" href="${yt}" target="_blank" rel="noopener">${fmtTimestamp(ex.t)}</a><span class="ex-topic" data-jump-id="${ex.episode_id}">${escapeHtml(ex.episode_title.slice(0, 70))}</span><div class="ex-text">“${escapeHtml(ex.text)}”</div></div>`;
          }
          previewHtml += `</div>`;
        }
      }

      document.getElementById('card-meta').innerHTML = metaHtml;
      document.getElementById('card-preview').innerHTML = previewHtml || '<div style="color:var(--text-dim);font-size:11px;">No excerpts indexed.</div>';

      // Connections list
      const edges = adjacency[node.id] || [];
      let html = `<div class="conn-header">CONNECTIONS (${edges.length})</div>`;
      edges.slice(0, 40).forEach(e => {
        const target = nodeById[e.id];
        if (!target) return;
        const targetKind = target.kind || 'episode';
        html += `<div class="conn-item"><div class="conn-edge"><span class="arrow">── </span><span class="label">${escapeHtml(e.label)}</span><span class="arrow"> ──▸</span></div><div class="conn-name kind-${targetKind}" data-node-id="${target.id}">${escapeHtml(target.name)}</div></div>`;
      });
      if (edges.length > 40) html += `<div style="color:var(--text-dim);font-size:10px;padding:6px 0;">+ ${edges.length - 40} more</div>`;
      document.getElementById('card-connections').innerHTML = html;

      card.classList.add('visible');
      resize.style.display = 'block';
      updateResizePosition();
    }

    function hideDetailCard() {
      document.getElementById('detail-card').classList.remove('visible');
      document.getElementById('panel-resize').style.display = 'none';
      selectedNode = null;
      // Clear selection highlighting
      if (Graph) {
        Graph.graphData().nodes.forEach(n => updateNodeAppearance(n, 'normal'));
        Graph.linkColor(Graph.linkColor())
             .linkWidth(Graph.linkWidth())
             .linkDirectionalParticles(VFX.particleCount.val);
      }
    }

    // ── Panel resize ──

    function updateResizePosition() {
      const card = document.getElementById('detail-card');
      const resize = document.getElementById('panel-resize');
      const width = card.getBoundingClientRect().width;
      resize.style.right = (width - 2) + 'px';
    }

    (function initPanelResize() {
      const resize = document.getElementById('panel-resize');
      const card = document.getElementById('detail-card');
      let startX, startWidth;

      resize.addEventListener('mousedown', e => {
        e.preventDefault();
        startX = e.clientX;
        startWidth = card.getBoundingClientRect().width;
        resize.classList.add('dragging');
        card.style.transition = 'none';

        function onMove(e) {
          const delta = startX - e.clientX;
          const newWidth = Math.max(280, Math.min(startWidth + delta, window.innerWidth * 0.6));
          document.documentElement.style.setProperty('--panel-width', newWidth + 'px');
          resize.style.right = (newWidth - 2) + 'px';
        }

        function onUp() {
          resize.classList.remove('dragging');
          card.style.transition = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    })();

    // Close button and Escape key listeners
    document.getElementById('card-close').addEventListener('click', hideDetailCard);

    // Connection name click — navigate to that node
    document.getElementById('card-connections').addEventListener('click', e => {
      const nameEl = e.target.closest('.conn-name');
      if (!nameEl) return;
      const id = parseInt(nameEl.dataset.nodeId);
      const node = nodeById[id];
      if (!node) return;
      handleNodeClick(node);
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') hideDetailCard();
      if (e.key === 'h' && Graph) {
        Graph.cameraPosition({ x: 0, y: 0, z: SCALE * 2.5 }, { x: 0, y: 0, z: 0 }, 1000);
      }
    });

    // ── initGraph ──

    function initGraph(nodes, edges) {
      const links = edges.map(e => ({
        source: e.source,
        target: e.target,
        label_forward: e.label_forward,
        label_backward: e.label_backward,
        topology: e.topology,
      }));

      // Build neighbor lookups for only the active topology's edges
      const activeEdges = edges.filter(e => e.topology === currentLayout);
      rebuildLookups(nodes, activeEdges);

      Graph = ForceGraph3D()
        (document.getElementById('graph'))
        .graphData({ nodes, links })
        .backgroundColor(`rgba(${hexToRgb(VFX.bgColor.val)},${VFX.bgAlpha.val})`)
        .showNavInfo(false)
        .warmupTicks(60)
        .cooldownTicks(Infinity)
        .nodeThreeObject(node => createNodeObject(node))
        .nodeThreeObjectExtend(false)
        .nodeLabel(node => buildNodeTooltip(node))
        .linkColor(link => getLinkColor(link))
        .linkWidth(link => getLinkWidth(link))
        .linkOpacity(1.0)
        .linkHoverPrecision(VFX.linkHoverPrec.val)
        .linkLabel(link => buildLinkTooltip(link))
        .linkDirectionalParticles(VFX.particleCount.val)
        .linkDirectionalParticleWidth(VFX.particleWidth.val)
        .linkDirectionalParticleSpeed(VFX.particleSpeed.val)
        .linkDirectionalParticleColor(() => `rgba(${hexToRgb(VFX.particleColor.val)},${VFX.particleAlpha.val})`)
        .linkCurvature(VFX.linkCurvatureVal.val)
        .linkVisibility(link => link.topology === currentLayout)
        .onNodeClick(handleNodeClick)
        .onNodeHover(handleNodeHover)
        .onBackgroundClick(handleBackgroundClick);

      // Custom position force
      Graph
        .d3Force('position', createPositionForce(0.18))
        .d3Force('center', null);
      Graph.d3Force('link').strength(0.008).distance(100);
      Graph.d3Force('charge').strength(-25);

      // CSS2D overlay for constant-size node labels
      const graphEl = document.getElementById('graph');
      const css2d = new CSS2DRenderer();
      css2d.setSize(graphEl.clientWidth, graphEl.clientHeight);
      css2d.domElement.style.position = 'absolute';
      css2d.domElement.style.top = '0';
      css2d.domElement.style.left = '0';
      css2d.domElement.style.pointerEvents = 'none';
      css2d.domElement.style.zIndex = '4';
      graphEl.appendChild(css2d.domElement);

      // Render CSS2D labels on every frame
      (function renderLabels() {
        if (Graph) css2d.render(Graph.scene(), Graph.camera());
        requestAnimationFrame(renderLabels);
      })();

      // Resize graph + CSS2D overlay when window changes
      window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        Graph.width(w).height(h);
        css2d.setSize(w, h);
      });

      // Post-processing bloom
      const renderer = Graph.renderer();
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(Graph.scene(), Graph.camera()));
      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(graphEl.clientWidth, graphEl.clientHeight),
        VFX.bloomStrength.val,
        VFX.bloomRadius.val,
        VFX.bloomThreshold.val
      );
      composer.addPass(bloomPass);
      Graph.postProcessingComposer(composer);

      // Set initial camera to the "H" recenter position
      Graph.cameraPosition({ x: 0, y: 0, z: SCALE * 2.5 }, { x: 0, y: 0, z: 0 });
    }

    // ── updateGraphData ──

    function updateGraphData(nodes, edges, refreshNodeObjects = false) {
      if (!Graph) return;
      const activeEdges = edges.filter(e => e.topology === currentLayout);
      rebuildLookups(nodes, activeEdges);
      const links = edges.map(e => ({
        source: e.source,
        target: e.target,
        label_forward: e.label_forward,
        label_backward: e.label_backward,
        topology: e.topology,
      }));
      Graph.graphData({ nodes, links });
      if (refreshNodeObjects) {
        Graph.nodeThreeObject(node => createNodeObject(node));
      }
    }

    // ── Topology switching ──

    const LAYOUT_DESCRIPTIONS = {
      central: 'CENTRALIZED \u2014 MEDOID EPISODE AT ORIGIN, ALL OTHERS RADIATE OUT BY DISTANCE',
      decentral: 'DECENTRALIZED \u2014 CLUSTER HUBS ON FIBONACCI SPHERE WITH EPISODES, TOPICS & PEOPLE ORBITING',
      distrib: 'DISTRIBUTED \u2014 SVD-PROJECTED TF\u00b7IDF SPACE; PROXIMITY = SHARED VOCABULARY & ENTITIES',
    };

    document.querySelectorAll('#controls button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLayout = btn.dataset.layout;
        document.getElementById('layout-desc').textContent = LAYOUT_DESCRIPTIONS[currentLayout] || '';
        if (Graph && allNodes.length) {
          const activeEdges = edgeSets[currentLayout] || [];
          // Swap visible edges without calling graphData (which resets simulation)
          Graph.linkVisibility(link => link.topology === currentLayout);
          rebuildLookups(allNodes, activeEdges);
          buildReadouts(allNodes.length, activeEdges.length);
          // Soften position force, reheat, then restore — smooth ~2s drift
          const posForce = Graph.d3Force('position');
          posForce.strength(0.03);
          Graph.d3ReheatSimulation();
          setTimeout(() => posForce.strength(0.18), 3000);
        }
      });
    });

    // Set initial layout description
    document.getElementById('layout-desc').textContent = LAYOUT_DESCRIPTIONS.central;

    // ── Legend, Cluster Labels ──

    function buildLegend(clusterNames) {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';

      Object.entries(clusterNames).forEach(([id, name]) => {
        const color = CLUSTER_COLORS[id % CLUSTER_COLORS.length];
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<div class="legend-dot" data-cluster-dot="${id}" style="background:${color};"></div>`
          + `<span class="legend-label">${escapeHtml(name)}</span>`;
        legend.appendChild(item);
      });

      // Special markers
      const special = document.createElement('div');
      special.className = 'legend-special';
      special.innerHTML =
        '<div class="legend-item"><div class="legend-dot" style="border:2px solid #ef4444;background:transparent;"></div><span class="legend-label">EMBEDDING MEDOID</span></div>'
        + '<div class="legend-item"><div class="legend-dot" style="border:2px solid #fb923c;background:transparent;"></div><span class="legend-label">LLM-NOMINATED CENTER</span></div>';
      legend.appendChild(special);
    }

    let clusterLabelEls = {};
    let clusterLabelRAF = null;

    function buildClusterLabels(clusterNames) {
      const container = document.getElementById('cluster-labels');
      container.innerHTML = '';
      clusterLabelEls = {};

      // Cancel existing loop before starting a new one
      if (clusterLabelRAF) {
        cancelAnimationFrame(clusterLabelRAF);
        clusterLabelRAF = null;
      }

      Object.entries(clusterNames).forEach(([id, name]) => {
        const el = document.createElement('div');
        el.className = 'cluster-label';
        el.textContent = name;
        el.style.color = CLUSTER_COLORS[id % CLUSTER_COLORS.length];
        el.style.opacity = '0';
        container.appendChild(el);
        clusterLabelEls[id] = el;
      });

      clusterLabelRAF = requestAnimationFrame(updateClusterLabelPositions);
    }

    function updateClusterLabelPositions() {
      clusterLabelRAF = requestAnimationFrame(updateClusterLabelPositions);
      if (!Graph) return;
      const show = currentLayout === 'decentral';
      const nodes = Graph.graphData().nodes;

      const centers = {};
      const counts = {};
      nodes.forEach(node => {
        const c = node.cluster_id;
        if (!centers[c]) { centers[c] = { x: 0, y: 0, z: 0 }; counts[c] = 0; }
        centers[c].x += node.x;
        centers[c].y += node.y;
        centers[c].z += node.z;
        counts[c]++;
      });

      Object.entries(clusterLabelEls).forEach(([id, el]) => {
        if (!show) { el.style.opacity = '0'; return; }
        const c = centers[id];
        const n = counts[id];
        if (!c || !n) return;
        const screen = Graph.graph2ScreenCoords(c.x / n, c.y / n, c.z / n);
        el.style.left = screen.x + 'px';
        el.style.top = screen.y + 'px';
        el.style.opacity = '1';
      });
    }

    function buildReadouts(nodeCount, edgeCount) {
      document.getElementById('readout-nodes').textContent = nodeCount;
      document.getElementById('readout-edges').textContent = edgeCount;
    }

    // ═══════════════════════════════════════════════
    // Config Panel Builder
    // ═══════════════════════════════════════════════

    function buildConfigPanel() {
      const panel = document.getElementById('config-panel');
      const sections = {};

      for (const [key, cfg] of Object.entries(VFX)) {
        if (!sections[cfg.section]) sections[cfg.section] = [];
        sections[cfg.section].push({ key, ...cfg });
      }

      let html = '';
      for (const [section, items] of Object.entries(sections)) {
        html += `<div class="config-section">`;
        html += `<div class="config-section-title">${section}</div>`;
        for (const item of items) {
          html += `<div class="config-row">`;
          html += `<span class="config-label">${item.label}</span>`;
          if (item.type === 'color') {
            html += `<input type="color" class="config-color" data-key="${item.key}" value="${item.val}">`;
            html += `<span class="config-hex" data-vfx="${item.key}">${item.val}</span>`;
          } else {
            const dec = item.step < 0.01 ? 3 : item.step < 1 ? 2 : 0;
            html += `<input type="range" class="config-slider" data-key="${item.key}" `;
            html += `min="${item.min}" max="${item.max}" step="${item.step}" value="${item.val}">`;
            html += `<span class="config-value" data-vfx="${item.key}">${Number(item.val).toFixed(dec)}</span>`;
          }
          html += `</div>`;
        }
        html += `</div>`;
      }

      panel.innerHTML = html;

      function doRefresh(refresh) {
        if (refresh === 'nodes') scheduleNodeRefresh();
        else if (refresh === 'scale') refreshNodeScales();
        else if (refresh === 'links') refreshLinks();
        else if (refresh === 'colors') refreshColors();
        else if (refresh === 'clusters') refreshClusters();
        else if (refresh === 'postfx') refreshPostFx();
        else if (refresh === 'chrome') refreshChrome();
      }

      // Wire slider events
      panel.querySelectorAll('.config-slider').forEach(slider => {
        slider.addEventListener('input', e => {
          const key = e.target.dataset.key;
          const val = parseFloat(e.target.value);
          VFX[key].val = val;
          const dec = VFX[key].step < 0.01 ? 3 : VFX[key].step < 1 ? 2 : 0;
          panel.querySelector(`[data-vfx="${key}"]`).textContent = val.toFixed(dec);
          doRefresh(VFX[key].refresh);
        });
      });

      // Wire color picker events
      panel.querySelectorAll('.config-color').forEach(picker => {
        picker.addEventListener('input', e => {
          const key = e.target.dataset.key;
          VFX[key].val = e.target.value;
          panel.querySelector(`[data-vfx="${key}"]`).textContent = e.target.value;
          doRefresh(VFX[key].refresh);
        });
      });
    }

    // Toggle color theme
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const names = Object.keys(COLOR_THEMES);
      const next = names[(names.indexOf(currentTheme) + 1) % names.length];
      applyTheme(next);
    });

    // (label-toggle and config panel removed from release build)
  </script>

<script data-pplx-inline-edit>
(function () {
  if (window === window.top) return;

  const allowedParentOrigins = ["https://www.perplexity.ai","https://perplexity.ai","https://testing.perplexity.ai","https://staging.perplexity.ai","https://*.preview.i.perplexity.ai","http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"];
  const MAX_FONT_BYTES = 500 * 1024;
  const MAX_TOTAL_FONT_BYTES = 2 * 1024 * 1024;
  let scrollForwarding = false;
  let scrollRaf = 0;
  let trustedTopOrigin = null;

  // Allow entries like "https://*.preview.i.perplexity.ai" — the wildcard
  // matches a single DNS label (no dots), so "https://*.foo" cannot stretch
  // across multiple labels.
  function matchesAllowedOrigin(origin) {
    if (!origin) return false;
    for (const entry of allowedParentOrigins) {
      if (!entry.includes("*")) {
        if (entry === origin) return true;
        continue;
      }
      const pattern = new RegExp(
        "^" +
          entry.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, "[^.]+") +
          "$",
      );
      if (pattern.test(origin)) return true;
    }
    return false;
  }

  // Trust decision: when the sender is same-origin-visible (event.origin is a
  // real origin like https://www.perplexity.ai) we trust event.origin directly.
  // When event.origin is "null" (opaque broker srcdoc), we fall back to the
  // broker's stamped `parentOrigin` to identify the top window. The fallback
  // is claim-only — we rely on the browser's native `targetOrigin` enforcement
  // on the response path (see postToTrustedTop) to ensure replies can't be
  // delivered to anyone but the actual top window of that claimed origin.
  function getTrustedParentOrigin(event) {
    const forwardedParentOrigin =
      typeof event.data.parentOrigin === "string" ? event.data.parentOrigin : null;
    const parentOrigin = event.origin === "null" ? forwardedParentOrigin : event.origin;
    return matchesAllowedOrigin(parentOrigin) ? parentOrigin : null;
  }

  // All responses go to window.top with targetOrigin = the allowlisted origin.
  // An attacker that iframes us inside their own null-origin broker can claim
  // any parentOrigin they like, but the browser will drop the reply whenever
  // the real top's origin doesn't match — so the screenshot never leaves.
  function postToTrustedTop(message) {
    if (!trustedTopOrigin) return;
    try {
      window.top.postMessage(message, trustedTopOrigin);
    } catch (_error) {}
  }

  function inlineAll(original, clone) {
    if (original.nodeType !== 1 || clone.nodeType !== 1) return;

    try {
      const computedStyle = getComputedStyle(original);
      // cssText on a computed style is the serialized declaration in modern
      // Chromium/Safari — a single read beats enumerating ~400 longhand
      // properties. Firefox returns "" here, so we fall back on empty.
      const serialized = computedStyle.cssText;
      if (serialized) {
        clone.style.cssText = serialized;
      } else {
        const parts = new Array(computedStyle.length);
        for (let index = 0; index < computedStyle.length; index += 1) {
          const property = computedStyle[index];
          parts[index] = `${property}:${computedStyle.getPropertyValue(property)};`;
        }
        clone.style.cssText = parts.join("");
      }
    } catch (_error) {}

    const originalChildren = original.children;
    const clonedChildren = clone.children;
    for (
      let index = 0;
      index < originalChildren.length && index < clonedChildren.length;
      index += 1
    ) {
      inlineAll(originalChildren[index], clonedChildren[index]);
    }
  }

  function extractFontUrl(srcValue) {
    const matches = [
      ...srcValue.matchAll(
        /url\(["']?([^"')]+)["']?\)(?:\s*format\(["']?([^"')]+)["']?\))?/gi,
      ),
    ];
    if (matches.length === 0) return null;
    const woff2 = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff2"));
    if (woff2) return woff2[1];
    const woff = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff"));
    if (woff) return woff[1];
    return matches[0][1];
  }

  // Cache resolved font URL -> data URI across captures. Fonts on a page
  // essentially never change, and a batch run emits multiple captures back to
  // back — without this we'd refetch + re-base64 every time.
  const fontDataUriCache = new Map();
  const SRC_DECLARATION_RE = /src\s*:\s*[^;}]+/i;

  async function fetchAsDataUri(url) {
    if (fontDataUriCache.has(url)) return fontDataUriCache.get(url);
    let dataUri = null;
    try {
      const response = await fetch(url, { mode: "cors", credentials: "omit" });
      if (response.ok) {
        const blob = await response.blob();
        if (blob.size <= MAX_FONT_BYTES) {
          dataUri = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () =>
              resolve(typeof reader.result === "string" ? reader.result : null);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(blob);
          });
        }
      }
    } catch (_error) {
      dataUri = null;
    }
    fontDataUriCache.set(url, dataUri);
    return dataUri;
  }

  function collectFontFaceRuleTexts() {
    const rules = [];
    for (const sheet of document.styleSheets) {
      let cssRules;
      try {
        cssRules = sheet.cssRules;
      } catch (_error) {
        continue;
      }
      if (!cssRules) continue;
      for (const rule of cssRules) {
        const cssText = rule.cssText || "";
        if (cssText.startsWith("@font-face")) rules.push(cssText);
      }
    }
    return rules;
  }

  async function buildInlinedFontCss() {
    const ruleTexts = collectFontFaceRuleTexts();
    if (ruleTexts.length === 0) return null;

    const resolved = ruleTexts.map((cssText) => {
      if (!SRC_DECLARATION_RE.test(cssText)) return null;
      const srcMatch = cssText.match(/src\s*:\s*([^;}]+)[;}]/i);
      if (!srcMatch) return null;
      const url = extractFontUrl(srcMatch[1]);
      if (!url) return null;
      try {
        return { cssText, url: new URL(url, document.baseURI).href };
      } catch (_error) {
        return null;
      }
    });

    const dataUris = await Promise.all(
      resolved.map((entry) => (entry ? fetchAsDataUri(entry.url) : Promise.resolve(null))),
    );

    const inlined = [];
    let totalBytes = 0;
    for (let index = 0; index < resolved.length; index += 1) {
      const entry = resolved[index];
      const dataUri = dataUris[index];
      if (!entry || !dataUri) continue;
      const approxBytes = dataUri.length * 0.75;
      if (totalBytes + approxBytes > MAX_TOTAL_FONT_BYTES) break;
      totalBytes += approxBytes;
      inlined.push(entry.cssText.replace(SRC_DECLARATION_RE, `src: url("${dataUri}")`));
    }
    return inlined.length > 0 ? inlined.join("\n") : null;
  }

  function stripExternal(clone) {
    const images = clone.querySelectorAll("img");
    for (let index = 0; index < images.length; index += 1) {
      const src = images[index].getAttribute("src");
      if (src && !src.startsWith("data:")) images[index].removeAttribute("src");
    }

    const elements = clone.querySelectorAll("*");
    for (let index = 0; index < elements.length; index += 1) {
      const style = elements[index].style.cssText;
      if (style && style.includes("url(")) {
        elements[index].style.cssText = style.replace(
          /url\(["']?(?!data:)[^)"']*["']?\)/gi,
          "none",
        );
      }
    }
  }

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="transform:translate(-${scrollX}px,-${scrollY}px);transform-origin:top left">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();
