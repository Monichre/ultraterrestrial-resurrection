<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="24" font-weight="bold">Agent Hub to Xata Migration Data Flow</text>
  
  <!-- Current Architecture Section -->
  <g id="current-architecture">
    <rect x="50" y="60" width="500" height="320" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="10"/>
    <text x="300" y="90" text-anchor="middle" font-size="18" font-weight="bold">Current Architecture</text>
    
    <!-- Agent Hub -->
    <rect x="70" y="110" width="150" height="60" fill="#4a90e2" stroke="#333" rx="5"/>
    <text x="145" y="145" text-anchor="middle" fill="white" font-size="14">Agent Hub</text>
    
    <!-- SQLAlchemy -->
    <rect x="70" y="190" width="150" height="60" fill="#7b68ee" stroke="#333" rx="5"/>
    <text x="145" y="225" text-anchor="middle" fill="white" font-size="14">SQLAlchemy ORM</text>
    
    <!-- PostgreSQL + pgvector -->
    <rect x="250" y="110" width="180" height="80" fill="#336791" stroke="#333" rx="5"/>
    <text x="340" y="135" text-anchor="middle" fill="white" font-size="14">PostgreSQL</text>
    <text x="340" y="155" text-anchor="middle" fill="white" font-size="12">+ pgvector extension</text>
    <text x="340" y="175" text-anchor="middle" fill="white" font-size="10">(1536/500 dimensions)</text>
    
    <!-- SQLite Cache -->
    <rect x="250" y="210" width="180" height="60" fill="#003b57" stroke="#333" rx="5"/>
    <text x="340" y="245" text-anchor="middle" fill="white" font-size="14">SQLite Cache</text>
    
    <!-- Upstash Vector -->
    <rect x="250" y="290" width="180" height="60" fill="#ff6b6b" stroke="#333" rx="5"/>
    <text x="340" y="325" text-anchor="middle" fill="white" font-size="14">Upstash Vector DB</text>
    
    <!-- Arrows -->
    <path d="M 220 140 L 250 140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 220 220 L 250 240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 220 220 L 250 320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- New Architecture Section -->
  <g id="new-architecture">
    <rect x="650" y="60" width="500" height="320" fill="#e8f5e9" stroke="#333" stroke-width="2" rx="10"/>
    <text x="900" y="90" text-anchor="middle" font-size="18" font-weight="bold">New Xata Architecture</text>
    
    <!-- Agent Hub -->
    <rect x="670" y="110" width="150" height="60" fill="#4a90e2" stroke="#333" rx="5"/>
    <text x="745" y="145" text-anchor="middle" fill="white" font-size="14">Agent Hub</text>
    
    <!-- Xata SDK -->
    <rect x="670" y="190" width="150" height="60" fill="#00a86b" stroke="#333" rx="5"/>
    <text x="745" y="225" text-anchor="middle" fill="white" font-size="14">Xata SDK</text>
    
    <!-- Xata Services -->
    <g id="xata-services">
      <!-- Xata Vector Search -->
      <rect x="850" y="110" width="180" height="50" fill="#00a86b" stroke="#333" rx="5"/>
      <text x="940" y="140" text-anchor="middle" fill="white" font-size="14">Xata Vector Search</text>
      
      <!-- Xata Ask API -->
      <rect x="850" y="170" width="180" height="50" fill="#00a86b" stroke="#333" rx="5"/>
      <text x="940" y="200" text-anchor="middle" fill="white" font-size="14">Xata Ask API (AI)</text>
      
      <!-- Xata Search API -->
      <rect x="850" y="230" width="180" height="50" fill="#00a86b" stroke="#333" rx="5"/>
      <text x="940" y="260" text-anchor="middle" fill="white" font-size="14">Xata Search API</text>
      
      <!-- Xata Database -->
      <rect x="850" y="290" width="180" height="60" fill="#00a86b" stroke="#333" rx="5"/>
      <text x="940" y="315" text-anchor="middle" fill="white" font-size="14">Xata Database</text>
      <text x="940" y="335" text-anchor="middle" fill="white" font-size="12">(Built-in vectors)</text>
    </g>
    
    <!-- Arrows -->
    <path d="M 820 140 L 850 135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 820 200 L 850 195" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 820 230 L 850 255" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 820 240 L 850 320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Migration Process -->
  <g id="migration-process">
    <rect x="50" y="420" width="1100" height="350" fill="#fff3e0" stroke="#333" stroke-width="2" rx="10"/>
    <text x="600" y="450" text-anchor="middle" font-size="18" font-weight="bold">Migration Process</text>
    
    <!-- Step 1 -->
    <g transform="translate(80, 470)">
      <rect width="200" height="120" fill="#ffeb3b" stroke="#333" rx="5"/>
      <text x="100" y="25" text-anchor="middle" font-weight="bold">1. Export Data</text>
      <text x="100" y="50" text-anchor="middle" font-size="12">• Export PostgreSQL data</text>
      <text x="100" y="70" text-anchor="middle" font-size="12">• Encode embeddings</text>
      <text x="100" y="90" text-anchor="middle" font-size="12">• Handle relationships</text>
      <text x="100" y="110" text-anchor="middle" font-size="12">• Validate integrity</text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(320, 470)">
      <rect width="200" height="120" fill="#4caf50" stroke="#333" rx="5"/>
      <text x="100" y="25" text-anchor="middle" font-weight="bold">2. Transform</text>
      <text x="100" y="50" text-anchor="middle" font-size="12">• Map schemas</text>
      <text x="100" y="70" text-anchor="middle" font-size="12">• Convert dimensions</text>
      <text x="100" y="90" text-anchor="middle" font-size="12">• Format embeddings</text>
      <text x="100" y="110" text-anchor="middle" font-size="12">• Generate Xata IDs</text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(560, 470)">
      <rect width="200" height="120" fill="#2196f3" stroke="#333" rx="5"/>
      <text x="100" y="25" text-anchor="middle" font-weight="bold">3. Load to Xata</text>
      <text x="100" y="50" text-anchor="middle" font-size="12">• Batch operations</text>
      <text x="100" y="70" text-anchor="middle" font-size="12">• Create records</text>
      <text x="100" y="90" text-anchor="middle" font-size="12">• Link relationships</text>
      <text x="100" y="110" text-anchor="middle" font-size="12">• Verify data</text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(800, 470)">
      <rect width="200" height="120" fill="#9c27b0" stroke="#333" rx="5"/>
      <text x="100" y="25" text-anchor="middle" font-weight="bold">4. Update Code</text>
      <text x="100" y="50" text-anchor="middle" font-size="12">• Replace SQLAlchemy</text>
      <text x="100" y="70" text-anchor="middle" font-size="12">• Use Xata SDK</text>
      <text x="100" y="90" text-anchor="middle" font-size="12">• Update queries</text>
      <text x="100" y="110" text-anchor="middle" font-size="12">• Test thoroughly</text>
    </g>
    
    <!-- Feature Comparisons -->
    <g transform="translate(80, 620)">
      <rect width="450" height="120" fill="#e3f2fd" stroke="#333" rx="5"/>
      <text x="225" y="25" text-anchor="middle" font-weight="bold">Before (pgvector/SQLite)</text>
      <text x="20" y="50" font-size="12">• Manual vector similarity search (SQL)</text>
      <text x="20" y="70" font-size="12">• Separate cache layer (SQLite)</text>
      <text x="20" y="90" font-size="12">• Complex embedding management</text>
      <text x="20" y="110" font-size="12">• Multiple database connections</text>
    </g>
    
    <g transform="translate(570, 620)">
      <rect width="450" height="120" fill="#c8e6c9" stroke="#333" rx="5"/>
      <text x="225" y="25" text-anchor="middle" font-weight="bold">After (Xata)</text>
      <text x="20" y="50" font-size="12">• Native vector search with filters</text>
      <text x="20" y="70" font-size="12">• Built-in caching and optimization</text>
      <text x="20" y="90" font-size="12">• Automatic embedding indexing</text>
      <text x="20" y="110" font-size="12">• Single API for all operations + AI Ask</text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    
    <!-- Migration flow arrows -->
    <marker id="flow-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
  </defs>
  
  <!-- Migration flow arrows -->
  <path d="M 300 380 L 300 420" stroke="#ff6b6b" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <text x="310" y="405" font-size="12" fill="#ff6b6b">Export</text>
  
  <path d="M 550 200 L 650 200" stroke="#ff6b6b" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <text x="580" y="195" font-size="12" fill="#ff6b6b">Migrate</text>
  
  <path d="M 280 530 L 320 530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 520 530 L 560 530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 760 530 L 800 530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>
